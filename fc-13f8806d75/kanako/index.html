<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<script src="../fclog.js"></script>
</head>
<body>
<title>英語フラッシュカード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one column of ring-bound vocabulary cards (単語カード). The card is the hero; controls sit under it. */
:root{
  --paper:#f6f4fa;      /* page: white with a faint lilac bias */
  --card:#ffffff;
  --ink:#251f3b;        /* text */
  --sub:#6a6385;        /* secondary text */
  --line:#ddd7ea;
  --berry:#b8326a;      /* accent */
  --berry-soft:#f7e3ec;
  --ok:#17806a; --ok-soft:#dff3ec;
  --ng:#c0392b; --ng-soft:#fbe6e3;
  --ring:#b9b2cc;
  --f-ja:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-en:"Lexend","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17141f; --card:#221d2e; --ink:#eeeaf7; --sub:#aaa3c2; --line:#3a3350;
  --berry:#ee7aa8; --berry-soft:#3d2333; --ok:#58c9a8; --ok-soft:#183a32; --ng:#f08a7c; --ng-soft:#41231f; --ring:#5c5474;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17141f; --card:#221d2e; --ink:#eeeaf7; --sub:#aaa3c2; --line:#3a3350;
  --berry:#ee7aa8; --berry-soft:#3d2333; --ok:#58c9a8; --ok-soft:#183a32; --ng:#f08a7c; --ng-soft:#41231f; --ring:#5c5474;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--f-ja);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;padding-block:28px 56px;display:grid;gap:18px}
h1{font:700 clamp(24px,6vw,32px)/1.2 var(--f-ja);margin:0;text-wrap:balance}
h1 small{display:block;font:500 13px/1.4 var(--f-ja);color:var(--sub);margin-top:6px;letter-spacing:.02em}
[lang="en"]{font-family:var(--f-en)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:44px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
button:disabled{cursor:default;opacity:.45}
.primary{background:var(--berry);border-color:var(--berry);color:#fff;font-weight:700}
:root[data-theme="dark"] .primary{color:#1a1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .primary{color:#1a1020}}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.modes button{text-align:left;display:grid;gap:2px;padding:10px 12px}
.modes b{font-size:15px}
.modes span{font-size:12px;color:var(--sub);line-height:1.4}
.modes .wide{grid-column:1/-1}
.range{display:flex;gap:8px;align-items:center;font-size:14px}
.range select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;flex:1;min-width:0}
.chip.spot{background:var(--line);color:var(--ink)}
.modes button[aria-pressed="true"]{border-color:var(--berry);background:var(--berry-soft);box-shadow:inset 0 0 0 1px var(--berry)}
.opts{display:grid;gap:6px;font-size:14px}
.opts label{display:flex;gap:8px;align-items:flex-start}
.opts input{margin-top:5px;accent-color:var(--berry)}
.status{display:flex;justify-content:space-between;align-items:center;font:500 14px var(--f-en);color:var(--sub);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--berry);transition:width .25s}
/* the card: a punched hole and ring at top-left, like a real 単語カード */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;
  min-height:240px;padding:34px 22px 22px;display:grid;align-content:center;gap:10px;text-align:center;
  box-shadow:0 1px 0 var(--line),0 10px 24px -14px rgba(60,40,90,.35);overflow-wrap:anywhere;width:100%}
.card::before{content:"";position:absolute;left:18px;top:14px;width:14px;height:14px;border-radius:50%;
  background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.card::after{content:"";position:absolute;left:12px;top:-10px;width:26px;height:32px;border:3px solid var(--ring);
  border-bottom-color:transparent;border-radius:50% 50% 40% 40%;}
button.card{cursor:pointer;font:inherit;color:inherit}
.tag{font-size:12px;letter-spacing:.08em;color:var(--sub)}
.q{font-size:clamp(24px,6vw,36px);line-height:1.3;font-weight:700}
.q[lang="en"]{font-weight:600}
.q.sent{font-size:clamp(20px,5vw,28px)}
.ans{border-top:1px dashed var(--line);padding-top:12px;font-size:clamp(18px,4.6vw,24px);color:var(--berry)}
.ans .past{display:block;font-size:14px;color:var(--sub);margin-top:4px}
.hint{font-size:13px;color:var(--sub)}
.timer{font:600 14px var(--f-en);color:var(--berry);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1 1 140px}
.typing{display:grid;gap:10px}
.typing label{display:grid;gap:4px;font-size:13px;color:var(--sub)}
.typing input{width:100%;font:500 20px var(--f-en);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.verdict{border-radius:14px;padding:12px 14px;display:grid;gap:6px;font-size:15px}
.verdict.ok{background:var(--ok-soft)} .verdict.ng{background:var(--ng-soft)}
.verdict b{font-size:17px}
.verdict.ok b{color:var(--ok)} .verdict.ng b{color:var(--ng)}
.diff{font:500 18px var(--f-en);letter-spacing:.02em}
.diff .x{color:var(--ng);text-decoration:underline wavy;text-underline-offset:4px}
.diff .miss{color:var(--ng);background:var(--ng-soft);border-radius:3px}
.choices{display:grid;gap:8px}
.choices button{text-align:left;display:flex;gap:10px;align-items:baseline}
.choices button b{font-family:var(--f-en);min-width:1.2em}
.choices.done button:disabled{opacity:.7}
.choices.done button.right,.choices.done button.wrong{opacity:1}
.choices button.right{border-color:var(--ok);background:var(--ok-soft)}
.choices button.wrong{border-color:var(--ng);background:var(--ng-soft)}
.script{font-size:14px;color:var(--sub);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.script [lang="en"]{color:var(--ink)}
.result{text-align:center;display:grid;gap:6px}
.score{font:600 clamp(44px,12vw,64px)/1 var(--f-en);font-variant-numeric:tabular-nums}
.score small{font-size:.4em;color:var(--sub)}
.delta{font-weight:700}
.delta.up{color:var(--ok)} .delta.same{color:var(--sub)} .delta.down{color:var(--ng)}
.misses{list-style:none;margin:0;padding:0;display:grid;gap:6px;text-align:left}
.misses li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:grid;gap:2px}
.misses .you{font-size:13px;color:var(--ng)}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
summary{cursor:pointer;font-weight:700;font-size:14px}
.weak{margin:10px 0 0;padding-left:1.4em;font-size:14px;display:grid;gap:2px}
.weak span{color:var(--sub);font-family:var(--f-en);font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--sub)}
.pool{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px}
.pool label{display:flex;gap:6px;align-items:center}
.pool input{accent-color:var(--berry)}
.pool em{font-style:normal;font-family:var(--f-en);color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;line-height:1;padding:4px 7px;border-radius:999px;letter-spacing:.04em;font-weight:700;white-space:nowrap}
.chip.chk{background:var(--berry-soft);color:var(--berry)}
.chip.ans{background:var(--ng-soft);color:var(--ng)}
.chip.common{background:var(--ok-soft);color:var(--ok)}
.card .chip{justify-self:center}
.note{font-size:13px;color:var(--sub);display:block;margin-top:6px}
.linkish{background:none;border:none;color:var(--berry);padding:6px 0;min-height:auto;text-decoration:underline}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.modes{grid-template-columns:1fr}}
</style>

<main>
  <h1>英語フラッシュカード<small id="sub"></small></h1>

  <section id="home" class="opts" aria-label="はじめる前に" style="display:grid;gap:14px">
    <div class="modes" role="group" aria-label="出し方">
      <button type="button" data-mode="ej"><b>英語 → 日本語</b><span>見て意味を言う・発音も聞ける</span></button>
      <button type="button" data-mode="je"><b>日本語 → 英語</b><span>英語をつづって打つ・過去形も</span></button>
      <button type="button" data-mode="mix"><b>英→日 ＋ リスニング</b><span>カード7まい・リスニング3問</span></button>
      <button type="button" data-mode="li"><b>リスニングだけ</b><span>英検4級の第1〜3部の形で10問</span></button>
      <button type="button" data-mode="spot" class="wide"><b>抜き打ちチェック</b><span>朝ドリルでやった日の単語ぜんぶから4択で10問。✓をつけなかった語も出る。×の語は「確かめたい語」に入る</span></button>
    </div>
    <label class="range" id="rangebox" hidden>範囲
      <select id="range"></select>
    </label>
    <p class="small" id="spotline"></p>
    <div class="pool" role="radiogroup" aria-label="出すカード">
      <span class="small">出すカード</span>
      <label><input type="radio" name="pool" id="pool-all" value="all" checked> <span>ぜんぶ</span><em id="n-all"></em></label>
      <label><input type="radio" name="pool" id="pool-chk" value="chk"> <span class="chip chk">✓</span><span>チェックした語</span><em id="n-chk"></em></label>
      <label><input type="radio" name="pool" id="pool-need" value="need"> <span class="chip ans">答案</span><span class="chip common">要注意</span><span>確かめたい語</span><em id="n-need"></em></label>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="timed" checked> 時間を計る（英→日 10秒／日→英 単語20秒・文40秒）</label>
      <label><input type="checkbox" id="typing" checked> 日→英は打ちこんで答える（はずすと頭の中で答えて自分で○×）</label>
    </div>
    <button type="button" id="start" class="primary">スタート</button>
    <p class="small" id="lastline"></p>
    <div class="row" role="group" aria-label="お父さんに送る">
      <button type="button" id="mailgmail">にがてなカードをお父さんに送る（Gmail）</button>
      <button type="button" id="mailapp">メールアプリで送る</button>
    </div>
    <p class="small" id="mailmsg" role="status"></p>
    <details id="parent">
      <summary>にがてなカード（おうちの人向け）</summary>
      <ol class="weak" id="weak"></ol>
      <div class="row" style="margin-top:10px">
        <button type="button" id="copyweak">一覧をコピー</button>
        <button type="button" id="reset">記録を消す</button>
      </div>
      <p class="small" id="parentmsg" role="status"></p>
    </details>
  </section>

  <section id="game" hidden style="display:grid;gap:14px" aria-label="問題">
    <div class="status"><span id="count"></span><span class="timer" id="clock" aria-live="off"></span><span id="right"></span></div>
    <div class="bar" aria-hidden="true"><i id="barfill" style="width:0"></i></div>
    <div id="stage" style="display:grid;gap:14px"></div>
    <button type="button" class="linkish" id="quit">やめてはじめの画面へ</button>
  </section>
</main>

      ||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en[-_]/i.test(v.lang))||null}catch{}
}
try{pickVoice();speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch{}
function speak(text){
  stopAudio();
  if(!EN_VOICE)pickVoice();
  if(!EN_VOICE){const b=$('say');if(b)b.textContent='この端末には英語の声がありません';return false}
  try{const u=new SpeechSynthesisUtterance(text);u.voice=EN_VOICE;u.lang=EN_VOICE.lang;u.rate=.9;speechSynthesis.speak(u);return true}catch{return false}
}
function playKey(key,fallbackText){
  stopAudio();
  const src=AUDIO&&AUDIO[key];
  if(!src) return fallbackText?speak(fallbackText):false;
  const a=new Audio(src); player=a; a.play().catch(()=>{if(fallbackText)speak(fallbackText)});
  return true;
}

// ---------- 判定 ----------
const CONTR={"doesn't":"does not","don't":"do not","isn't":"is not","aren't":"are not","it's":"it is","i'm":"i am",
  "what's":"what is","that's":"that is","he's":"he is","she's":"she is","can't":"cannot","didn't":"did not","wasn't":"was not","weren't":"were not"};
function norm(s){
  let t=(s||'').normalize('NFKC').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.,!?;:"“”()]/g,' ').replace(/\s+/g,' ').trim();
  t=t.split(' ').map(w=>CONTR[w]||w).join(' ').replace(/\bcan not\b/g,'cannot');
  return t;
}
function judge(card,base,past){
  const b=norm(base), p=norm(past);
  const forms=[[card.en,card.past||null],...(card.accept||[])];
  for(const [e,ps] of forms){
    if(b===norm(e)) return {ok:!card.past||!ps||p===norm(ps), baseOk:true, pastOk:!card.past||!ps||p===norm(ps), alt:null};
  }
  for(const [e,ps] of (card.alts||[])){
    if(b===norm(e)){const pastOk=!card.past||p===norm(ps);return {ok:pastOk,baseOk:true,pastOk,alt:e}}
  }
  return {ok:false,baseOk:false,pastOk:!card.past||p===norm(card.past),alt:null};
}
// 正しい答えのうち、打った答えに無い文字を色づけ（LCS）
function diffHTML(correct,given){
  const a=correct, b=(given||'').normalize('NFKC');
  const A=a.toLowerCase(), B=b.toLowerCase().replace(/[’]/g,"'");
  const n=A.length,m=B.length, L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]||(A[i]==='’'&&B[j]==="'")?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const keepA=new Array(n).fill(false), keepB=new Array(m).fill(false);
  let i=0,j=0;
  while(i<n&&j<m){ if(A[i]===B[j]||(A[i]==='’'&&B[j]==="'")){keepA[i]=keepB[j]=true;i++;j++} else if(L[i+1][j]>=L[i][j+1])i++; else j++; }
  const esc=c=>c.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const wrap=(s,keep,cls)=>[...s].map((c,k)=>keep[k]||c===' '?esc(c):`<span class="${cls}">${esc(c)}</span>`).join('');
  return {right:wrap(a,keepA,'miss'), mine:b.trim()?wrap(b,keepB,'x'):'（空らん）'};
}

// ---------- 出題 ----------
function rec(key){return hist[key] ||= {w:{},miss:0,seen:0}}
function weight(key,dir){return 1+Math.min(9,(hist[key]?.w?.[dir])||0)}
function sample(pool,count,keyOf,dir){
  const rest=[...pool], out=[];
  while(out.length<count&&rest.length){
    const ws=rest.map(x=>weight(keyOf(x),dir)); let r=Math.random()*ws.reduce((a,b)=>a+b,0);
    const k=ws.findIndex(w=>(r-=w)<0); out.push(rest.splice(k<0?rest.length-1:k,1)[0]);
  }
  return out;
}
const cardEntry=(c,dir)=>({type:'card',dir,item:c,key:c.en});
const listenEntry=q=>({type:'listen',dir:'li',item:q,key:'listening:'+q.id});
let queue=[],pos=0,results=[],isRetry=false,state=null,tick=null,deadline=0;

function buildQueue(){
  const D=deckNow();
  if(mode==='spot') return pickSpots(10,spotRange());
  if(mode==='li') return sample(LISTEN,10,q=>'listening:'+q.id,'li').map(listenEntry);
  const nSpot=0; // カードの回に4択をまぜるのはやめた（2026-11-26 須藤さん：分かりにくくなる）。4択は「抜き打ちチェック」だけ
  const insert=(arr,items)=>{for(const x of items)arr.splice(1+Math.floor(Math.random()*arr.length),0,x);return arr};
  if(mode==='ej'||mode==='je') return insert(sample(D,10-nSpot,c=>c.en,mode).map(c=>cardEntry(c,mode)),pickSpots(nSpot,STUDIED));
  const cs=sample(D,7-nSpot,c=>c.en,'ej').map(c=>cardEntry(c,'ej'));
  insert(cs,sample(LISTEN,3,q=>'listening:'+q.id,'li').map(listenEntry));
  return insert(cs,pickSpots(nSpot,STUDIED));
}
function begin(q,retry){
  queue=q;pos=0;results=[];isRetry=retry;
  $('home').hidden=true;$('game').hidden=false;
  loadAudio().then(()=>{ if(state&&state.entry?.type==='listen') renderListen(); });
  show();
}
function stopTimer(){clearInterval(tick);tick=null;$('clock').textContent=''}
function startTimer(sec,onEnd){
  stopTimer(); if(!$('timed').checked)return;
  deadline=performance.now()+sec*1000;
  const upd=()=>{const s=Math.max(0,Math.ceil((deadline-performance.now())/1000));$('clock').textContent='のこり '+s+' 秒';if(s===0){stopTimer();onEnd()}};
  upd(); tick=setInterval(upd,100);
}
function header(){
  const n=queue.length;
  $('count').textContent=Math.min(pos+1,n)+' / '+n+' 問'+(isRetry?'（×だけ）':'');
  $('right').textContent='○ '+results.filter(r=>r.ok).length;
  $('barfill').style.width=(pos/n*100)+'%';
}
function show(){
  stopAudio();stopTimer();
  if(pos>=queue.length)return finish();
  const entry=queue[pos]; state={entry,revealed:false,done:false,plays:0,choice:null};
  header();
  if(entry.type==='listen')renderListen();
  else if(entry.type==='spot')renderSpot();
  else if(entry.dir==='je'&&$('typing').checked)renderType();
  else renderFlip();
}
function next(ok,given){
  if(state.done)return; state.done=true; stopTimer();
  const e=state.entry, r=rec(e.key);
  r.seen++; if(!ok)r.miss++;
  r.w[e.dir]=Math.max(0,(r.w[e.dir]||0)+(ok?-1:2));
  store.set(HK,hist);
  results.push({entry:e,ok,given});
}
function advance(){pos++;show()}
const el=(html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

// 日→英：つづりを打って自動で答え合わせ
function renderType(){
  const c=state.entry.item, sent=c.kind==='sentence';
  const stage=$('stage'); stage.replaceChildren();
  stage.append(el(`<div class="card">${chip(c)}<span class="tag">英語で書こう</span>
    <span class="q ${sent?'sent':''}" lang="ja">${esc(c.ja)}</span>
    ${c.past?'<span class="hint">ふつうの形と、過去形の2つを書く</span>':''}</div>
    <form class="typing" id="tf" autocomplete="off">
      <label>英語<input id="in1" lang="en" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="${c.past?'next':'done'}"></label>
      ${c.past?'<label>過去形<input id="in2" lang="en" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done"></label>':''}
      <button type="submit" class="primary" id="check">答え合わせ</button>
    </form><div id="fb" style="display:grid;gap:10px"></div>`));
  const submit=()=>{
    if(state.revealed)return; state.revealed=true; stopTimer();
    const g1=$('in1').value, g2=c.past?$('in2').value:'';
    $('in1').disabled=true; if(c.past)$('in2').disabled=true; $('check').hidden=true;
    const j=judge(c,g1,g2), d=diffHTML(c.en,g1), dp=c.past?diffHTML(c.past,g2):null;
    const parts=[];
    if(j.ok) parts.push(`<b>○ 正解</b>${j.alt?`<span>「${esc(j.alt)}」でも意味は通るので○。このカードで覚えたいのは <span lang="en">${esc(c.en)}</span></span>`:''}`);
    else{
      parts.push(`<b>×</b>`);
      if(!j.baseOk) parts.push(`<span>正しい答え：<span class="diff" lang="en">${d.right}</span></span><span>あなたの答え：<span class="diff" lang="en">${d.mine}</span></span>`);
      else parts.push(`<span>英語は○。過去形がちがう</span>`);
      if(c.past&&!j.pastOk) parts.push(`<span>過去形：<span class="diff" lang="en">${dp.right}</span>（あなた：<span class="diff" lang="en">${dp.mine}</span>）</span>`);
    }
    if(j.ok&&c.past) parts.push(`<span lang="en">${esc(c.en)} → ${esc(c.past)}</span>`);
    if(c.note) parts.push(`<span class="note">${esc(c.note)}</span>`);
    $('fb').append(el(`<div class="verdict ${j.ok?'ok':'ng'}" role="status">${parts.join('')}</div>
      <div class="row"><button type="button" id="say">▶ 発音を聞く</button><button type="button" class="primary" id="go">次へ</button></div>`));
    $('say').onclick=()=>playKey('w:'+c.en,c.en);
    $('go').onclick=advance; $('go').focus();
    next(j.ok,g1+(c.past?' / '+g2:''));
  };
  $('tf').onsubmit=e=>{e.preventDefault();
    if(c.past&&document.activeElement===$('in1')&&!$('in2').value){$('in2').focus();return}
    submit()};
  $('in1').focus();
  startTimer(sent?40:20,submit);
}

// 抜き打ち：4択で自動判定。×なら「確かめたい語」へ
function renderSpot(){
  const {entry}=state, w=entry.item, ej=entry.dir==='ej4';
  const opts=spotChoices(w);
  const stage=$('stage'); stage.replaceChildren();
  stage.append(el(`<div class="card"><span class="chip spot">抜き打ち・${esc(w.day)}の単語</span>
    <span class="tag">${ej?'意味をえらぼう':'英語をえらぼう'}</span>
    <span class="q" lang="${ej?'en':'ja'}">${esc(ej?w.en:w.ja)}</span></div>
    <div class="choices" id="choices"></div><div id="fb" style="display:grid;gap:10px"></div>`));
  const box=$('choices');
  opts.forEach((o,i)=>{
    const b=el(`<button type="button"><b>${i+1}</b><span lang="${ej?'ja':'en'}">${esc(ej?o.ja:o.en)}</span></button>`).firstChild;
    b.onclick=()=>choose(i); box.append(b);
  });
  const right=opts.indexOf(w);
  function choose(i){
    if(state.revealed)return; state.revealed=true; stopTimer();
    const ok=i===right;
    box.classList.add('done');
    box.querySelectorAll('button').forEach((b,k)=>{b.disabled=true;
      b.querySelector('span').textContent=ej?`${opts[k].ja}（${opts[k].en}）`:`${opts[k].en}（${opts[k].ja}）`;
      if(k===right)b.classList.add('right'); else if(k===i)b.classList.add('wrong');});
    if(!ok) promote(w);
    const pair=(PARTNER[w.en]||[]).filter(en=>WBY.has(en)).map(en=>`${en}＝${WBY.get(en).ja}`).join('／');
    $('fb').append(el(`<div class="verdict ${ok?'ok':'ng'}" role="status"><b>${i<0?'時間切れ ×':ok?'○ 正解':'×'}</b>
      <span><span lang="en">${esc(w.en)}</span>＝${esc(w.ja)}${w.past?`（過去形 <span lang="en">${esc(w.past)}</span>）`:''}</span>
      ${pair?`<span class="note">組で覚える：<span lang="en">${esc(pair)}</span></span>`:''}
      ${ok?'':'<span class="note">「確かめたい語」のカードに入れました</span>'}</div>
      <div class="row"><button type="button" id="say">▶ 発音を聞く</button><button type="button" class="primary" id="go">次へ</button></div>`));
    $('say').onclick=()=>playKey('w:'+w.en,w.en);
    $('go').onclick=advance; $('go').focus();
    next(ok,i<0?'':(ej?opts[i].ja:opts[i].en));
  }
  startTimer(10,()=>choose(-1));
}

const MODE_NAME={ej:'英語 → 日本語',je:'日本語 → 英語',mix:'英→日 ＋ リスニング',li:'リスニングだけ',spot:'抜き打ちチェック'};
function finish(){
  stopTimer(); header(); $('barfill').style.width='100%';
  const n=queue.length, ok=results.filter(r=>r.ok).length, miss=results.filter(r=>!r.ok);
  // お父さんのスプレッドシートへ記録（GitHub Pages 版だけ。fclog.js が無いページでは何もしない）
  try{window.fcLog&&window.fcLog({who:'加奈子',ev:'やり終えた',mode:MODE_NAME[mode]+(isRetry?'（×のやり直し）':''),right:ok,n,
    miss:miss.map(r=>{const e=r.entry,c=e.item||{};return e.type==='listen'?'リスニング '+c.id:((c.en||'')+'＝'+(c.ja||''))})})}catch{}
  let delta='';
  const key=scoreKey();
  if(!isRetry){
    const prev=last[key];
    if(prev==null) delta='<span class="delta same">はじめての記録。次はこれと比べます</span>';
    else if(ok>prev.score) delta=`<span class="delta up">前回 ${prev.score} → 今回 ${ok}　+${ok-prev.score}</span>`;
    else if(ok===prev.score) delta=`<span class="delta same">前回と同じ ${ok}。キープ</span>`;
    else delta=`<span class="delta down">前回 ${prev.score} → 今回 ${ok}。×のカードをもう一度やろう</span>`;
    const best=Math.max(ok,prev?.best||0);
    if(prev&&ok>(prev.best||0)) delta+='<span class="delta up">自己ベスト更新</span>';
    last[key]={score:ok,best,at:Date.now()}; store.set(LK,last);
  }else delta=`<span class="delta same">×だった ${n} 問のうち ${ok} 問を取り返した</span>`;
  const items=miss.map(r=>{const e=r.entry,c=e.item;
    if(e.type==='listen')return `<li><span><b>リスニング</b> ${esc(PART[c.part]||'')}：正解 ${c.answer}. <span lang="en">${esc(c.opts[c.answer-1])}</span></span><span class="small" lang="en">${esc(c.script)} ${esc(c.prompt||'')}</span>${r.given?`<span class="you">あなた：${esc(r.given)}</span>`:''}</li>`;
    return `<li><span><span lang="en"><b>${esc(c.en)}</b></span>${c.past?` <span class="small" lang="en">(過去形 ${esc(c.past)})</span>`:''}</span><span>${esc(c.ja)}</span>${c.note?`<span class="small">${esc(c.note)}</span>`:''}${e.dir==='je'&&r.given?`<span class="you" lang="en">あなた：${esc(r.given)}</span>`:''}</li>`}).join('');
  const stage=$('stage'); stage.replaceChildren();
  stage.append(el(`<div class="result"><span class="tag">${MODE_NAME[mode]}</span>
    <div class="score">${ok}<small> / ${n}</small></div>${delta}</div>
    ${miss.length?`<h2 style="font-size:16px;margin:4px 0 0">×だったカード</h2><ul class="misses">${items}</ul>`:'<p style="text-align:center;margin:0">全問○。</p>'}
    <div class="row">${miss.length?`<button type="button" class="primary" id="retry">×だけもう一度（${miss.length}問）</button>`:''}
    <button type="button" id="again" ${miss.length?'':'class="primary"'}>次の10問</button></div>`));
  if(miss.length)$('retry').onclick=()=>begin(miss.map(r=>r.entry),true);
  $('again').onclick=()=>begin(buildQueue(),false);
  ($('retry')||$('again')).focus();
  $('count').textContent='おわり';
}

  }
  const sp=spotPool(STUDIED), tested=sp.filter(w=>hist['spot:'+w.en]?.seen), missed=tested.filter(w=>hist['spot:'+w.en].miss);
  $('spotline').textContent=STUDIED.length?`抜き打ち：結果を取り込んだ ${dayLabel(STUDIED[0])}〜${dayLabel(STUDIED[STUDIED.length-1])} の ${sp.length}語のうち ${tested.length}語を確かめた（×だった語 ${missed.length}）`:'';
  const rangeName=mode==='spot'?($('range').value==='all'?'これまでぜんぶ':$('range').selectedOptions[0]?.text.split('の単語')[0]):'';
  const what=MODE_NAME[mode]+(mode==='li'?'':mode==='spot'?`（${rangeName}）`:`（${POOL_NAME[pool]}）`);
  $('lastline').textContent=p?`${what}の前回：${p.score} / 10（自己ベスト ${p.best}）。今日はこれを超えよう`:`${what}はまだ記録なし`;
  for(const k of Object.keys(POOLS)){$('n-'+k).textContent=POOLS[k]().length+'まい';$('pool-'+k).checked=k===pool}
  $('sub').textContent=`${allCards().length}まいのカード ＋ 英検4級型リスニング${LISTEN.length}問`;
  renderWeak();
}
const POOL_NAME={all:'ぜんぶ',chk:'チェックした語',need:'確かめたい語'};
$('range').onchange=()=>{store.set('kanako-eng-range',$('range').value);home()};
function scoreKey(){if(mode==='spot')return 'spot/'+($('range').value||'all');return mode+(mode==='li'?'':'/'+pool)+($('typing').checked||mode!=='je'?'':'-self')}
document.querySelectorAll('input[name="pool"]').forEach(r=>r.onchange=()=>{if(r.checked){pool=r.value;store.set('kanako-eng-pool',pool);home()}});
function weakList(){
  const rows=[];
  for(const [k,v] of Object.entries(hist)){ if(!v.miss)continue;
    let label=k;
    if(k.startsWith('spot:')){const w=WBY.get(k.slice(5));label=w?`抜き打ち ${w.en}　${w.ja}（${w.day}）`:k}
    else if(k.startsWith('listening:')){const q=LISTEN.find(x=>'listening:'+x.id===k);label=q?`リスニング ${q.id}（${q.prompt||q.script.slice(0,40)}）`:k}
    else{const c=DECK.find(x=>x.en===k);if(c)label=`${c.en}　${c.ja}`}
    rows.push({label,miss:v.miss,seen:v.seen});
  }
  return rows.sort((a,b)=>b.miss-a.miss||b.miss/b.seen-a.miss/a.seen).slice(0,15);
}
function renderWeak(){
  const rows=weakList();
  $('weak').innerHTML=rows.length?rows.map(r=>`<li>${esc(r.label)} <span>× ${r.miss} / ${r.seen}回</span></li>`).join(''):'<li style="list-style:none;margin-left:-1.4em">まだ×の記録はありません</li>';
}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;store.set('kanako-eng-mode',mode);home()});
$('timed').onchange=()=>{try{localStorage.setItem('kanako-eng-timed',$('timed').checked?'on':'off')}catch{}};
$('typing').onchange=()=>{try{localStorage.setItem('kanako-eng-typing',$('typing').checked?'on':'off')}catch{};home()};
$('start').onclick=()=>begin(buildQueue(),false);
$('quit').onclick=home;
$('copyweak').onclick=()=>{
  const text=weakList().map(r=>`${r.label}（× ${r.miss}/${r.seen}回）`).join('\n')||'×の記録なし';
  const done=()=>$('parentmsg').textContent='コピーしました';
  try{navigator.clipboard.writeText(text).then(done,()=>{$('parentmsg').textContent=text})}catch{$('parentmsg').textContent=text}
};
// ---------- お父さんにメールで送る（2026-11-26） ----------
function sendDad(subject,body,how){
  const to=['haru5385','gmail.com'].join('@');
  if(body.length>1800) body=body.slice(0,1800)+'\n…（つづきは省略）';
  if(how==='gmail') window.open('https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(to)+'&su='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body),'_blank','noopener');
  else location.href='mailto:'+to+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
}
function weakMail(how){
  const day=new Date().toLocaleDateString('ja-JP');
  const rows=weakList();
  const body=['加奈子の英語フラッシュカード にがてなカード（'+day+'）','']
    .concat(rows.length?rows.map(r=>'・'+r.label+'（× '+r.miss+'/'+r.seen+'回）'):['まだ×の記録はありません'])
    .concat(['','（フラッシュカードから送信）']).join('\n');
  sendDad('加奈子 英語フラッシュカードの記録（'+day+'）',body,how);
  $('mailmsg').textContent='メールの画面が開いたら、そのまま「送信」を押してね';
}
$('mailgmail').onclick=()=>weakMail('gmail');
$('mailapp').onclick=()=>weakMail('app');
let resetArmed=false;
$('reset').onclick=()=>{
  if(!resetArmed){resetArmed=true;$('reset').textContent='本当に消す（もう一度押す）';$('parentmsg').textContent='前回の点数と×の記録が消えます';return}
  hist=seed();last={};promoted={};store.set(HK,hist);store.set(LK,last);store.set(PK,promoted);resetArmed=false;$('reset').textContent='記録を消す';$('parentmsg').textContent='記録を消しました';home();
};
home();
