<title>４教科フラッシュカード</title>

<style>
/* レイアウト：1枚のカードを中央に。上に進み具合、下に記録。単語カードの表裏をそのまま画面にする */
:root {
  --bg: #eef3ef;
  --card: #ffffff;
  --ink: #1d2a25;
  --sub: #5b6b64;
  --line: #d3ddd7;
  --accent: #17604f;
  --accent-ink: #ffffff;
  --soft: #e1ece6;
  --ok: #1f7a4a;
  --ng: #b0402f;
  --warn: #b7791f;
  --kokugo: #b0402f; --kokugo-bg: #f8e4df;
  --sansu: #2b5ea8; --sansu-bg: #e0eaf8;
  --rika: #1f7a4a; --rika-bg: #dff0e5;
  --shakai: #9a6312; --shakai-bg: #f6ead3;
  --paper: #ffffff;
  --font-body: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  --font-head: "Zen Maru Gothic", "BIZ UDPGothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a17; --card: #1b2622; --ink: #e6efe9; --sub: #9fb2a9; --line: #2e3d37;
    --accent: #5cc0a2; --accent-ink: #0d1a15; --soft: #23332d;
    --ok: #5cc08a; --ng: #ef8a78; --warn: #e6b45c;
    --kokugo: #ef8a78; --kokugo-bg: #3a2420; --sansu: #8fb4ee; --sansu-bg: #1f2b3d;
    --rika: #6fcf98; --rika-bg: #1c3326; --shakai: #e3b264; --shakai-bg: #3a2e18;
    --paper: #f4f4f1; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a17; --card: #1b2622; --ink: #e6efe9; --sub: #9fb2a9; --line: #2e3d37;
  --accent: #5cc0a2; --accent-ink: #0d1a15; --soft: #23332d;
  --ok: #5cc08a; --ng: #ef8a78; --warn: #e6b45c;
  --kokugo: #ef8a78; --kokugo-bg: #3a2420; --sansu: #8fb4ee; --sansu-bg: #1f2b3d;
  --rika: #6fcf98; --rika-bg: #1c3326; --shakai: #e3b264; --shakai-bg: #3a2e18;
  --paper: #f4f4f1; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
h1 { font-family: var(--font-head); font-size: 1.5rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
header small { color: var(--sub); font-size: .8rem; }
h2 { font-family: var(--font-head); margin: 0; text-wrap: balance; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.modes { display: grid; gap: 10px; }
.mode { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--card); }
.mode b { font-family: var(--font-head); font-size: 1.05rem; }
.mode p { margin: 0; color: var(--sub); font-size: .85rem; grid-column: 1; }
.mode button { grid-row: 1 / span 2; grid-column: 2; }
.mode.new { border-color: var(--accent); background: var(--soft); }
.new-tag { display: inline-block; font-size: .7rem; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 8px; margin-left: 6px; vertical-align: 2px; letter-spacing: .05em; }
button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer; background: var(--accent); color: var(--accent-ink); min-height: 44px; }
button.secondary { background: var(--soft); color: var(--ink); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.ok { background: var(--ok); color: #fff; }
button.ng { background: var(--ng); color: #fff; }
button.link { background: none; color: var(--accent); padding: 4px 0; min-height: 0; text-decoration: underline; font-weight: 400; }
button:focus-visible, summary:focus-visible, .chip:focus-within { outline: 3px solid var(--warn); outline-offset: 2px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions > button { flex: 1 1 140px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: .82rem; cursor: pointer; user-select: none; background: var(--card); }
.chip input { margin: 0; accent-color: var(--accent); }
.chip:has(input:checked) { background: var(--soft); border-color: var(--accent); }
details.pick > summary { cursor: pointer; color: var(--accent); font-size: .88rem; }
details.pick[open] { display: flex; flex-direction: column; gap: 8px; }
.subj-row { display: grid; grid-template-columns: 3.2em 1fr; gap: 6px; align-items: start; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: .78rem; font-weight: 700; }
.s0 { background: var(--kokugo-bg); color: var(--kokugo); }
.s1 { background: var(--sansu-bg); color: var(--sansu); }
.s2 { background: var(--rika-bg); color: var(--rika); }
.s3 { background: var(--shakai-bg); color: var(--shakai); }
.pill.kind { background: var(--soft); color: var(--accent); border: 1px solid var(--accent); }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.meta { color: var(--sub); font-size: .85rem; }
.track { display: flex; gap: 4px; }
.track span { flex: 1; height: 7px; border-radius: 4px; background: var(--line); }
.track .current { background: var(--warn); }
.track .correct { background: var(--ok); }
.track .wrong { background: var(--ng); }
.status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.face { margin: 0; font-size: .75rem; letter-spacing: .12em; color: var(--sub); }
.q { font-family: var(--font-head); font-size: 1.3rem; line-height: 1.6; font-weight: 700; margin: 0; }
.figs { display: flex; flex-direction: column; gap: 8px; }
.figs img, .back img { display: block; max-width: 100%; height: auto; background: var(--paper); border-radius: 8px; border: 1px solid var(--line); margin: 0 auto; }
.figs img { max-height: 56vh; object-fit: contain; }
.back { background: var(--soft); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.back .ans { margin: 0; font-size: 1.1rem; font-weight: 700; }
.back img { max-height: 40vh; object-fit: contain; }
.src { font-size: .75rem; color: var(--sub); margin: 0; }
.help { margin: 0; color: var(--sub); font-size: .85rem; }
.timer { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--sub); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.timer.over { color: var(--warn); font-weight: 700; }
.timer.over .bar i { background: var(--warn); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; font-size: .78rem; color: var(--sub); }
.stats strong { display: block; font-size: 1.3rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.result h2 { font-size: 1.6rem; }
.score { display: flex; gap: 18px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.score div { display: flex; flex-direction: column; }
.score span { font-size: .78rem; color: var(--sub); }
.score b { font-size: 1.6rem; }
.list { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.list li span { display: block; color: var(--sub); font-size: .9rem; }
.note { color: var(--sub); font-size: .8rem; margin: 0; }
details.parent > summary { cursor: pointer; font-weight: 700; font-family: var(--font-head); }
details.parent[open] { gap: 12px; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: left; vertical-align: top; }
td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tablewrap { overflow-x: auto; }
textarea { width: 100%; min-height: 8em; font: inherit; font-size: .8rem; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--card); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header><h1>４教科フラッシュカード</h1><small>小学４年 · 中学受験</small></header>

  <p class="note" id="notice" hidden>このブラウザでは記録を保存できません。ページを閉じると記録は消えます。</p>
</div>

で時間をつぶしてなまける）。","src":"栄冠への道 第11回 p.166・解答p.45"},{"id":"ko-n-13","s":"国語","topic":"第11回 慣用句","q":"「引退（いんたい）するハルトくんが、後輩（こうはい）のアキヤくんを新キャプテンに指名した。」この場面に合う慣用句は？","a":"バトンをわたす（仕事や地位などを、後任者（こうにんしゃ）に引き継ぐこと）。","src":"栄冠への道 第11回 p.166・解答p.45"},{"id":"ko-n-14","s":"国語","topic":"第11回 慣用句","q":"「折り紙をつける」とはどういう意味？","a":"確かであると保証する。","src":"本科教室 第11回 p.171","w":1},{"id":"ko-n-15","s":"国語","topic":"第11回 慣用句","q":"「あとの祭り」とはどういう意味？","a":"すでに手遅れで、間に合わない。","src":"本科教室 第11回 p.171","w":1},{"id":"ko-n-16","s":"国語","topic":"第10回 ことわざ","q":"昔から言い伝えられ、教訓（きょうくん）や生活の知恵（ちえ）をふくむ、短い言い回しのことばを何という？","a":"ことわざ（漢字では「諺」）。","src":"本科教室 第10回 p.153"},{"id":"ko-n-17","s":"国語","topic":"第10回 ことわざ","q":"「いろはがるた」とは、どんな遊び？","a":"「いろはうた」の一文字ごとにことわざを当てはめて読み札にし、絵札をとることを競う遊び。","src":"本科教室 第10回 p.153"},{"id":"ko-n-18","s":"国語","topic":"第10回 ことわざ","q":"「負けるが勝ち」とはどういう意味？","a":"争わずに勝ちをゆずった方が、得をすることが多い。","src":"本科教室 第10回 p.153","w":1},{"id":"ko-n-19","s":"国語","topic":"第10回 ことわざ","q":"「鬼（おに）に金棒（かなぼう）」とはどういう意味？","a":"それを手に入れることで、強いものがますます強くなる。","src":"本科教室 第10回 p.154（いろはがるた）","w":1},{"id":"ko-n-20","s":"国語","topic":"第10回 ことわざ","q":"「頭かくして尻（しり）かくさず」とはどういう意味？","a":"欠点の一部をかくして、全部をかくした気でいる。","src":"本科教室 第10回 p.153","w":1},{"id":"ko-n-21","s":"国語","topic":"第10回 ことわざ","q":"「身から出たさび」とはどういう意味？","a":"自分の行いが原因で、災（わざわ）いにあう。","src":"本科教室 第10回 p.153","w":1},{"id":"ko-n-22","s":"国語","topic":"第10回 ことわざ","q":"「知らぬが仏（ほとけ）」とはどういう意味？","a":"知らないでいる方が、おだやかな気持ちでいられる。","src":"本科教室 第10回 p.153","w":1},{"id":"ko-n-23","s":"国語","topic":"第10回 ことわざ","q":"「犬も歩けば棒に当たる」とはどういう意味？","a":"何かをしようとすれば、思いがけない災難（さいなん）にあう。（思いがけない幸運にあうこともある。）","src":"本科教室 第10回 p.154（いろはがるた）","w":1},{"id":"ko-n-24","s":"国語","topic":"第10回 ことわざ","q":"「骨折（ほねお）り損のくたびれ儲（もう）け」とはどういう意味？","a":"苦労しても何の効果も上がらず、ただ疲れだけが残ること。","src":"本科教室 第10回 p.154（いろはがるた）","w":1},{"id":"ko-n-25","s":"国語","topic":"第10回 ことわざ","q":"「ごくわずかなものでも、積もり積もれば大きなものになる」という意味のことわざは？","a":"ちりも積もれば山となる","src":"本科教室 第10回 p.154（いろはがるた）","w":1},{"id":"ko-n-26","s":"国語","topic":"第10回 ことわざ","q":"「旅は道連（みちづ）れ世は情（なさ）け」とはどういう意味？","a":"旅では連れがいる方が心強いように、世の中を生きていくには支え合うことが大切だ。","src":"本科教室 第10回 p.154（いろはがるた）","w":1},{"id":"ko-n-27","s":"国語","topic":"第10回 ことわざ","q":"「良薬は口に苦し」とはどういう意味？","a":"身のためになる忠告（ちゅうこく）は、聞きづらいものだ。「良薬」は「りょうやく」と読む。","src":"本科教室 第10回 p.154（いろはがるた）","w":1},{"id":"ko-n-28","s":"国語","topic":"第10回 ことわざ","q":"「ふたつのものの違いがはなはだしいこと」を表すことわざは？","a":"月とすっぽん","src":"本科教室 第10回 p.154（いろはがるた）"},{"id":"ko-n-29","s":"国語","topic":"第10回 ことわざ","q":"「念（ねん）には念を入れよ」とはどういう意味？","a":"注意した上にも、さらによく注意する。","src":"本科教室 第10回 p.154（いろはがるた）","w":1},{"id":"ko-n-30","s":"国語","topic":"第10回 ことわざ","q":"「不運・不幸が重なること」を表すことわざは？","a":"泣きっ面（つら）に蜂（はち）","src":"本科教室 第10回 p.154（いろはがるた）"},{"id":"ko-n-31","s":"国語","topic":"第12回 四字熟語・性格のことば","q":"「四字熟語」とは、どんな言葉？","a":"漢字四字でできた熟語のうち、四字がそろって一つの意味を表し、よく使われるもの。","src":"本科教室 第12回 p.184"},{"id":"ko-n-32","s":"国語","topic":"第12回 四字熟語・性格のことば","q":"□日□秋（待ち遠しいこと）。□に、数を表す漢字を入れよう。","a":"一と千。「一日千秋」。","src":"栄冠への道 第12回 p.182・解答p.48"},{"id":"ko-n-33","s":"国語","topic":"第12回 四字熟語・性格のことば","q":"「新しい環境（かんきょう）で、心機一転、がんばろう。」の「心機一転」とはどういう意味？","a":"あるきっかけで、気持ちを入れかえること。","src":"本科教室 第12回 p.184","w":1},{"id":"ko-n-34","s":"国語","topic":"第12回 四字熟語・性格のことば","q":"「休みなく、目に見えて進歩すること」を表す四字熟語は？","a":"日進月歩","src":"本科教室 第12回 p.184"},{"id":"ko-n-35","s":"国語","topic":"第12回 四字熟語・性格のことば","q":"「部屋をかたづけるように注意されても、兄は□とばかりに聞き流す。」□に入る四字熟語は？","a":"馬耳東風（心にとめず、聞き流すこと）。","src":"栄冠への道 第12回 p.182・解答p.48"},{"id":"ko-n-36","s":"国語","topic":"第12回 四字熟語・性格のことば","q":"「彼は、喜怒哀楽のはげしい人だ。」の「喜怒哀楽」とはどういう意味？","a":"人間のさまざまな感情。「喜び・怒り・哀（かな）しみ・楽しみ」のこと。","src":"本科教室 第12回 p.185・第11回 p.164","w":1},{"id":"ko-n-37","s":"国語","topic":"第12回 四字熟語・性格のことば","q":"「おなかがすいて、無我夢中でからあげを食べる。」の「無我夢中」とはどういう意味？","a":"すっかり心をうばわれて、我（われ）を忘れる。","src":"本科教室 第12回 p.185・栄冠 解答p.48","w":1},{"id":"ko-n-38","s":"国語","topic":"第12回 四字熟語・性格のことば","q":"「母の予想は、百発百中で当たる。」の「百発百中」とはどういう意味？","a":"計画やねらいなどが、すべて当たる。","src":"本科教室 第12回 p.185","w":1},{"id":"ko-n-39","s":"国語","topic":"第12回 四字熟語・性格のことば","q":"母が何も言わないのに、父は母の食べたかったプリンを買ってきた。こういう間がらを表す、「心」が二つ入る四字熟語は？","a":"以心伝心（話さなくても、お互いの思いが伝わる）。","src":"栄冠への道 第12回 p.182・解答p.48"},{"id":"ko-n-40","s":"国語","topic":"第12回 四字熟語・性格のことば","q":"□進□退（状況などが良くなったり悪くなったりして、なかなか前に進まないこと）。□に、数を表す漢字を入れよう。","a":"一と一。「一進一退」。","src":"栄冠への道 第12回 p.182・解答p.48"},{"id":"ko-n-41","s":"国語","topic":"第12回 四字熟語・性格のことば","q":"「電光石火」とはどういう意味？","a":"動作、ふるまいなどが、非常にすばやいこと。","src":"本科教室 第12回 p.185","w":1},{"id":"ko-n-42","s":"国語","topic":"第12回 四字熟語・性格のことば","q":"「冬、寒い日が三日つづき、暖かい日が四日続くこと」を表す四字熟語は？","a":"三寒四温","src":"栄冠への道 第12回 p.182・解答p.48"},{"id":"ko-n-43","s":"国語","topic":"第12回 四字熟語・性格のことば","q":"性格を表す言葉で、「慎重（しんちょう）」はプラスの意味でとらえられる。同じような性格を、マイナスの意味でとらえた四字熟語は？","a":"優柔不断（ゆうじゅうふだん）","src":"本科教室 第12回 p.183 国語探検","w":1},{"id":"ko-n-44","s":"国語","topic":"第12回 四字熟語・性格のことば","q":"「飽（あ）きっぽい」と言うと短所のよう。長所のように言いかえると？","a":"切りかえが早く、柔軟（じゅうなん）。","src":"栄冠への道 第12回 p.183"},{"id":"ko-n-45","s":"国語","topic":"第12回 四字熟語・性格のことば","q":"性格を表す「短気」を、長所のように言いかえると？","a":"例：感情が豊か。","src":"栄冠への道 第12回 p.183・解答p.48","w":1},{"id":"sa-n-01","s":"算数","topic":"第9・10回 速さと進行グラフ","q":"分速70 mで12分歩くと、何m進む？","a":"840 m。道のり＝速さ×時間。70×12＝840。","src":"本科 第9回 速さの3公式（道のり＝速さ×時間）"},{"id":"sa-n-02","s":"算数","topic":"第9・10回 速さと進行グラフ","q":"1800 mの道のりを分速75 mで歩くと、何分かかる？","a":"24分。時間＝道のり÷速さ。1800÷75＝24。","src":"本科 第9回 速さの3公式（時間＝道のり÷速さ）"},{"id":"sa-n-03","s":"算数","topic":"第9・10回 速さと進行グラフ","q":"135 kmを3時間で走る自動車の速さは、時速何km？","a":"時速45 km。速さ＝道のり÷時間。135÷3＝45。","src":"本科 第9回 速さの3公式（速さ＝道のり÷時間）"},{"id":"sa-n-04","s":"算数","topic":"第9・10回 速さと進行グラフ","q":"Aさんは200 mを40秒、Bさんは100 mを18秒で走る。速いのはどちら？","a":"Bさん。道のりを200 mにそろえると、Bは18×2＝36秒。かかる時間が短いBの方が速い。","src":"本科 第9回 速さくらべ（道のりをそろえる）"},{"id":"sa-n-05","s":"算数","topic":"第9・10回 速さと進行グラフ","q":"Aさんは3分で240 m、Bさんは5分で350 m歩く。速いのはどちら？","a":"Aさん。1分あたりにそろえると、Aは240÷3＝80で分速80 m、Bは350÷5＝70で分速70 m。","src":"本科 第9回 速さくらべ（1あたりにそろえる）"},{"id":"sa-n-06","s":"算数","topic":"第9・10回 速さと進行グラフ","q":"秒速15 mは時速何km？","a":"時速54 km。1時間は3600秒。15×3600＝54000で54000 m。mをkmに直して54 km。","src":"栄冠への道 第9回 単位をかえる（秒速→時速）"},{"id":"sa-n-07","s":"算数","topic":"第9・10回 速さと進行グラフ","q":"時速72 kmは秒速何m？","a":"秒速20 m。72 kmは72000 m。1時間は3600秒なので、72000÷3600＝20。","src":"栄冠への道 第9回 単位をかえる（時速→秒速）"},{"id":"sa-n-08","s":"算数","topic":"第9・10回 速さと進行グラフ","q":"分速250 mは時速何km？","a":"時速15 km。250×60＝15000で15000 m。最後にmをkmに直す。","src":"栄冠への道 第9回 単位をかえる（分速→時速）"},{"id":"sa-n-09","s":"算数","topic":"第9・10回 速さと進行グラフ","q":"同じ速さで歩くと、5分で350 m進む。20分では何m進む？","a":"1400 m。20分は5分の4倍なので、道のりも4倍。350×4＝1400。","src":"本科 第9回 速さが一定なら時間と道のりは比例"},{"id":"sa-n-10","s":"算数","topic":"第9・10回 速さと進行グラフ","q":"150 kmの道のりを時速40 kmで走ると、何時間何分かかる？","a":"3時間45分。3時間で120 km進み、のこりは30 km。10 kmを15分で進むので、30 kmは45分。","src":"栄冠への道 第9回 時間の単位をまたぐ答え（○時間○分）"},{"id":"sa-n-11","s":"算数","topic":"第9・10回 速さと進行グラフ","q":"午前9時40分に出発し、72 kmの道のりを時速48 kmで走った。着いたのは午前何時何分？","a":"午前11時10分。72÷48＝1.5で1.5時間＝1時間30分。9時40分＋1時間30分。","src":"本科 第9回 時刻の計算"},{"id":"sa-n-12","s":"算数","topic":"第9・10回 速さと進行グラフ","q":"進行グラフ（横じくが時間、たてじくが道のり）で、線が横にまっすぐな部分は何を表す？","a":"止まっている（休んでいる）。時間はたっているのに、道のりが増えていない。","src":"本科 第10回 グラフの形から動きを読む"},{"id":"sa-n-13","s":"算数","topic":"第9・10回 速さと進行グラフ","q":"ある道を分速60 mで歩くと20分かかる。同じ道を分速80 mで歩くと何分かかる？","a":"15分。道のりは60×20＝1200で1200 m。1200÷80＝15。","src":"本科 第9回 道のりが同じなら時間と速さは反比例"},{"id":"sa-n-14","s":"算数","topic":"第9・10回 速さと進行グラフ","q":"1200 mはなれた所にいるAとBが、向かい合って同時に出発した。Aは分速70 m、Bは分速80 m。2人が出会うのは何分後？","a":"8分後。1分で2人は70＋80＝150で150 m近づく。1200÷150＝8。","src":"本科 第10回 出会い（2本の線が交わる）"},{"id":"sa-n-15","s":"算数","topic":"第9・10回 速さと進行グラフ","q":"弟が分速60 mで家を出た。その6分後、兄が同じ道を分速90 mで追いかけた。兄は家を出てから何分後に弟に追いつく？","a":"12分後。兄が出るとき、2人の間は60×6＝360で360 m。1分で90−60＝30で30 mずつちぢまる。360÷30＝12。","src":"本科 第10回 追いつき（後から出発）"},{"id":"sa-n-16","s":"算数","topic":"第11・12回 線分図（和と差・倍）","q":"60 cmのテープを2本に切ったら、長い方が短い方より14 cm長くなった。長い方は何cm？","a":"37 cm。2本とも長い方にそろえると、(60＋14)÷2＝37。","src":"栄冠への道 第11回 和差算（大＝(和＋差)÷2）"},{"id":"sa-n-17","s":"算数","topic":"第11・12回 線分図（和と差・倍）","q":"2000円を兄と弟で分けたら、兄が弟より600円多くなった。弟は何円？","a":"700円。2人とも弟にそろえると、(2000−600)÷2＝700。","src":"本科 第11回 和差算（小＝(和−差)÷2）"},{"id":"sa-n-18","s":"算数","topic":"第11・12回 線分図（和と差・倍）","q":"夜が昼より2時間40分短い日。昼の長さは何時間何分？（1日は24時間）","a":"13時間20分。24時間＋2時間40分＝26時間40分が昼の2つ分。÷2で13時間20分。","src":"栄冠への道 第11回 和差算（昼と夜）"},{"id":"sa-n-19","s":"算数","topic":"第11・12回 線分図（和と差・倍）","q":"A、B、Cの3人のシールは合わせて60枚。AはBより4枚多く、BはCより7枚多い。Cは何枚？","a":"14枚。Cにそろえる。AはCより11枚、BはCより7枚多いので、60−11−7＝42がCの3つ分。42÷3＝14。","src":"本科 第11回 3つの量の和と差（いちばん小さいものにそろえる）"},{"id":"sa-n-20","s":"算数","topic":"第11・12回 線分図（和と差・倍）","q":"連続する3つの整数をたすと159になった。いちばん小さい数は？","a":"52。2番目は1、3番目は2大きいので、159−3＝156がいちばん小さい数の3つ分。156÷3＝52。","src":"本科 第11回 連続する整数の和"},{"id":"sa-n-21","s":"算数","topic":"第11・12回 線分図（和と差・倍）","q":"AとBは合わせて5000円持っている。AがBに150円わたすと、2人のお金が等しくなる。Aは初め何円持っていた？","a":"2650円。等しくなったときは5000÷2＝2500で2500円ずつ。Aはわたす前、それより150円多かった。2500＋150＝2650。","src":"栄冠への道 第11回 やりとり（わたすと等しくなる）"},{"id":"sa-n-22","s":"算数","topic":"第11・12回 線分図（和と差・倍）","q":"Aは900円、Bは500円持っている。AがBに何円わたすと、Aのお金がBより100円多くなる？","a":"150円。合計の1400円は変わらない。わたした後のBは(1400−100)÷2＝650で650円。650−500＝150。","src":"本科 第11回 やりとり（わたした後の差）"},{"id":"sa-n-23","s":"算数","topic":"第11・12回 線分図（和と差・倍）","q":"3人で出かけ、Aが3人分の電車代1800円、Bが3人分の昼食代2700円を払い、Cは何も払わなかった。3人が同じ金額を払ったことにするには、CはAとBにそれぞれ何円わたす？","a":"Aに300円、Bに1200円。1人分は(1800＋2700)÷3＝1500で1500円。Aは300円、Bは1200円多く払っている。","src":"本科 第11回 やりとり（まとめて払って同じ金額にする）"},{"id":"sa-n-24","s":"算数","topic":"第11・12回 線分図（和と差・倍）","q":"兄は弟の4倍のお金を持っていて、2人の合計は7500円。弟は何円持っている？","a":"1500円。弟を①とすると兄は④で、合計は⑤。7500÷5＝1500。","src":"本科 第12回 「倍」の線分図（合計がわかる）"},{"id":"sa-n-25","s":"算数","topic":"第11・12回 線分図（和と差・倍）","q":"兄は弟の3倍のお金を持っていて、2人の差は2400円。弟は何円持っている？","a":"1200円。弟を①とすると兄は③で、差は②。2400÷2＝1200。","src":"本科 第12回 「倍」の線分図（差がわかる）"},{"id":"sa-n-26","s":"算数","topic":"第11・12回 線分図（和と差・倍）","q":"3900円をA、B、Cの3人で分けたら、AはBの2倍、BはCの4倍になった。Cは何円？","a":"300円。Cを①とするとBは④、Aは⑧。合わせて⑬。3900÷13＝300。","src":"栄冠への道 第12回 3つの量の「倍」"},{"id":"sa-n-27","s":"算数","topic":"第11・12回 線分図（和と差・倍）","q":"ノート1冊と筆箱1つを合わせると900円。筆箱の値段は、ノートの値段の3倍より100円高い。ノートは1冊何円？","a":"200円。ノートを①とすると筆箱は③＋100円。900−100＝800が④。800÷4＝200。","src":"本科 第12回 「倍より○円高い」"},{"id":"sa-n-28","s":"算数","topic":"第11・12回 線分図（和と差・倍）","q":"兄は1本90円のペンを、弟は1本60円のえんぴつを、同じ本数ずつ買った。2人の代金の差は210円。兄は何本買った？","a":"7本。1本あたりの差は90−60＝30で30円。210÷30＝7。","src":"本科 第12回 差集め算（同じ本数ずつ）"},{"id":"sa-n-29","s":"算数","topic":"第11・12回 線分図（和と差・倍）","q":"同じ日から、Aは毎日15円ずつ、Bは毎日20円ずつ貯金する。2人の貯金の差が100円になるのは、何日分貯金したとき？","a":"20日分。1日あたりの差は20−15＝5で5円。100÷5＝20。","src":"栄冠への道 第12回 差集め算（毎日の貯金）"},{"id":"sa-n-30","s":"算数","topic":"第11・12回 線分図（和と差・倍）","q":"Aは1本120円のあめを、Bは1本90円のあめを買った。買った本数はBの方が5本多く、2人の代金は同じだった。Aは何本買った？","a":"15本。Bの多い5本分は90×5＝450で450円。これを1本あたりの差120−90＝30で30円ずつ集める。450÷30＝15。","src":"本科 第12回 差集め算（本数がちがい代金が同じ）"},{"id":"sa-n-31","s":"算数","topic":"第13回 つるかめ算","q":"つるとかめが合わせて15匹いる。足の数の合計は42本。かめは何匹？","a":"6匹。全部つるなら2×15＝30で30本。42−30＝12本の差。つる1羽をかめ1匹に取りかえると2本増えるので、12÷2＝6。","src":"本科 第13回 「もし、すべてが○○だとしたら」"},{"id":"sa-n-32","s":"算数","topic":"第13回 つるかめ算","q":"つるとかめが合わせて20匹いる。足の数の合計は64本。つるは何羽？","a":"8羽。全部かめなら4×20＝80で80本。80−64＝16本の差。かめ1匹をつる1羽に取りかえると2本へるので、16÷2＝8。","src":"栄冠への道 第13回 演習（つるを求める）"},{"id":"sa-n-33","s":"算数","topic":"第13回 つるかめ算","q":"つるかめ算で、かめの数を先に求めたい。「もし、全部が○○だとしたら」の○○には、つるとかめのどちらを入れる？","a":"つる。求めたい方とはちがう方を全部と考えると、求めたい方の数が先に出てくる。","src":"栄冠への道 第13回 学び❷ 求めたい方とはちがう方に仮定する"},{"id":"sa-n-34","s":"算数","topic":"第13回 つるかめ算","q":"10円切手と50円切手を合わせて30枚買い、代金は900円だった。50円切手は何枚？","a":"15枚。全部10円切手なら300円。900−300＝600円の差。1枚取りかえると40円増えるので、600÷40＝15。","src":"本科 第13回 いろいろな題材（切手）"},{"id":"sa-n-35","s":"算数","topic":"第13回 つるかめ算","q":"1冊80円のノートと1冊120円のノートを合わせて15冊買い、代金は1440円だった。80円のノートは何冊？","a":"9冊。全部120円なら1800円。1800−1440＝360円の差。1冊取りかえると40円へるので、360÷40＝9。","src":"本科 第13回 いろいろな題材（ノート）"},{"id":"sa-n-36","s":"算数","topic":"第13回 つるかめ算","q":"コインを投げて、表が出たら6点、裏が出たら2点もらえる。15回投げて58点だった。表は何回出た？","a":"7回。全部裏なら2×15＝30で30点。58−30＝28点の差。1回取りかえると4点増えるので、28÷4＝7。","src":"本科 第13回 いろいろな題材（コイン）"},{"id":"sa-n-37","s":"算数","topic":"第13回 つるかめ算","q":"1個90円のあんパンと1個150円のメロンパンを合わせて12個買い、代金は1380円だった。メロンパンは何個？","a":"5個。全部あんパンなら1080円。1380−1080＝300円の差。1個取りかえると60円増えるので、300÷60＝5。","src":"本科 第13回 表を使って組をさがす（パン）"},{"id":"sa-n-38","s":"算数","topic":"第13回 つるかめ算","q":"正解すると5点もらえ、まちがえると2点ひかれる計算問題がある。20問解いて79点だった。まちがえたのは何問？","a":"3問。全部正解なら100点。正解1問がまちがいに変わると5＋2＝7で7点へる。(100−79)÷7＝3。","src":"栄冠への道 第13回 まちがえるとひかれる"},{"id":"sa-n-39","s":"算数","topic":"第13回 つるかめ算","q":"正解すると4点もらえ、まちがえると1点ひかれるテストがある。25問すべて解いて80点だった。まちがえたのは何問？","a":"4問。全部正解なら100点。1問まちがえると4＋1＝5で5点へる。(100−80)÷5＝4。","src":"別冊 第13回 まちがえるとひかれる"},{"id":"sa-n-40","s":"算数","topic":"第13回 つるかめ算","q":"荷物を1個運ぶと50円もらえる。とちゅうでこわすと、50円がもらえないうえに30円はらう。100個運んで4520円もらった。こわしたのは何個？","a":"6個。全部こわさなければ5000円。1個こわすと50＋30＝80で80円へる。(5000−4520)÷80＝6。","src":"栄冠への道 第13回 品物をこわすと支払う"},{"id":"sa-n-41","s":"算数","topic":"第13回 つるかめ算","q":"1600 mの道を、初めは分速60 m、とちゅうから分速100 mで歩き、全部で20分かかった。分速60 mで歩いたのは何分？","a":"10分。全部分速100 mなら100×20＝2000で2000 m。2000−1600＝400 mの差。1分取りかえると40 mへるので、400÷40＝10。","src":"栄冠への道 第13回 速さ×時間＝道のりの面積図"},{"id":"sa-n-42","s":"算数","topic":"第13回 つるかめ算","q":"12 kmの山道を、上りは時速2 km、下りは時速4 kmで進み、全部で4時間かかった。上りにかかったのは何時間？","a":"2時間。全部下りなら4×4＝16で16 km。16−12＝4 kmの差。1時間取りかえると2 kmへるので、4÷2＝2。","src":"本科 第13回 上りと下り"},{"id":"sa-n-43","s":"算数","topic":"第13回 つるかめ算","q":"「犬とねこが合わせて20匹。足の数の合計は80本。犬は何匹？」この問題が解けないのはなぜ？","a":"犬もねこも足は4本なので、取りかえても足の数が変わらない。何匹ずつでも足は80本になるから。","src":"本科 第13回 いぬねこ算（解くことができない文章題）"},{"id":"sa-n-44","s":"算数","topic":"第13回 つるかめ算","q":"20円切手と50円切手を買って、代金をちょうど200円にしたい。どちらか一方だけを買う場合もふくめると、枚数の組み合わせは何通り？","a":"3通り。20円切手が10枚・5枚・0枚のとき（50円切手は0枚・2枚・4枚）。20円切手5枚と50円切手2枚はどちらも100円なので、入れかえても代金は同じ。","src":"栄冠への道 第13回 研究（「合わせて何枚」がない）"},{"id":"sa-n-45","s":"算数","topic":"第13回 つるかめ算","q":"1個70円のみかんと1個110円のりんごを合わせて16個買い、代金は1400円だった。りんごは何個？","a":"7個。全部みかんなら1120円。1400−1120＝280円の差。1個取りかえると40円増えるので、280÷40＝7。","src":"本科 第13回 オプション（みかんとりんご）"},{"id":"ri-n-01","s":"理科","topic":"第5回 星の動き","q":"北極星（ほっきょくせい）は、何という星座の、どこにある星？","a":"こぐま座のしっぽの先。※北斗七星がある「おおぐま座」とまちがえない。","src":"本科教室 第5回 p.104／栄冠への道 p.52"},{"id":"ri-n-02","s":"理科","topic":"第5回 星の動き","q":"北極星は何等星（とうせい）？","a":"2等星。※1等星ではない。まわりにも星が多いので、手がかりがないと見つけにくい。","src":"本科教室 第5回 p.106／栄冠への道 p.53"},{"id":"ri-n-03","s":"理科","topic":"第5回 星の動き","q":"北斗七星（ほくとしちせい）は、何という星座の一部？ どんな形にならんでいる？","a":"おおぐま座。7つの星が、ひしゃくの形にならぶ。","src":"本科教室 第5回 p.104・p.118"},{"id":"ri-n-04","s":"理科","topic":"第5回 星の動き","q":"北斗七星を使って北極星を見つけるには、どこの間かくを何倍のばす？","a":"ひしゃくの先の2つの星の間かくを、5倍のばす。","src":"本科教室 第5回 p.106"},{"id":"ri-n-05","s":"理科","topic":"第5回 星の動き","q":"カシオペヤ座を使って北極星を見つけるには、どこの長さを何倍のばす？","a":"Wの両はしの辺をのばして交わった点と、Wのまん中の星を結んだ長さを、5倍のばす。※北斗七星と同じ5倍。","src":"本科教室 第5回 p.106"},{"id":"ri-n-06","s":"理科","topic":"第5回 星の動き","q":"昔の人が、北極星を方角を知る目印にしたのはなぜ？","a":"時間がたっても位置を変えず、いつも真北にあるから。","src":"本科教室 第5回 p.103／栄冠への道 p.52"},{"id":"ri-n-07","s":"理科","topic":"第5回 星の動き","q":"南の空の星は、どの方角から出て、どの方角へ動いて見える？ 回る向きは？","a":"東から出て、南の空を通り、西へ。右回り（時計回り）。※北の空は左回り（反時計回り）。","src":"栄冠への道 第5回 p.54"},{"id":"ri-n-08","s":"理科","topic":"第5回 星の動き","q":"北の空の星が回る中心は北極星。では、南の空の星が回る中心はどこにある？","a":"地平線（ちへいせん）の下。","src":"栄冠への道 第5回 p.54"},{"id":"ri-n-09","s":"理科","topic":"第5回 星の動き","q":"18時にカシオペヤ座を見た。次の日の朝6時までに、北極星のまわりを何度動いて見える？","a":"180度。18時→0時が6時間、0時→6時が6時間で、合わせて12時間。15×12＝180。※日をまたぐときは0時で区切って数える。","src":"本科教室 第5回 p.111 表1／栄冠への道 p.54"},{"id":"ri-n-10","s":"理科","topic":"第5回 星の動き","q":"毎日同じ時刻に見ると、カシオペヤ座は1か月で30度動いて見える。11月5日18時の位置から180度動いた所に見えるのは、何月5日の18時？","a":"5月5日。180÷30＝6か月後。※1日の動き（1時間に15度）とまぜない。","src":"栄冠への道 第5回 p.61"},{"id":"ri-n-11","s":"理科","topic":"第5回 星の動き","q":"星が1日のうちに動いて見える原因は何？ 地球は、どの向きに、どれだけ回っている？","a":"地球の自転（じてん）。地じくを中心に、西から東へ、1日に1回転。※星そのものが動いているのではない。","src":"本科教室 第5回 p.114〜115／栄冠への道 p.55"},{"id":"ri-n-12","s":"理科","topic":"第5回 星の動き","q":"星によって通り道の高さがちがう。真上（まうえ）付近を通るのはどの星座？","a":"こと座・はくちょう座。","src":"本科教室 第5回 p.115／栄冠への道 p.55"},{"id":"ri-n-13","s":"理科","topic":"第5回 星の動き","q":"さそり座は、空のどんな所を通る星座？","a":"南の空の低いところ。※通り道がいちばん低い星座。","src":"本科教室 第5回 p.115／栄冠への道 p.55"},{"id":"ri-n-14","s":"理科","topic":"第5回 星の動き","q":"カシオペヤ座は、1日のうちに地平線（ちへいせん）の下にしずむ？","a":"しずまない（1日中しずまない）。北極星のまわりを回っている。","src":"栄冠への道 第5回 p.55"},{"id":"ri-n-15","s":"理科","topic":"第5回 星の動き","q":"星の観測（かんそく）をする日、明るいうちにしておくことは？","a":"方位磁針（ほういじしん）などで、観測する方角を確かめておく。記録には、月日・時刻と、建物や木などの目印も書く。","src":"本科教室 第5回 p.109"},{"id":"ri-n-16","s":"理科","topic":"第6回 月の形と動き","q":"太陽・地球・月は、それぞれ恒星（こうせい）・惑星（わくせい）・衛星（えいせい）のどれ？","a":"太陽＝恒星、地球＝惑星、月＝衛星。3つのうち、自分で光を出しているのは太陽だけ。","src":"本科教室 第6回 p.124／栄冠への道 p.72"},{"id":"ri-n-17","s":"理科","topic":"第6回 月の形と動き","q":"地球から月までは約何km？ 地球が約何個ならぶくらい？","a":"約38万km。地球約30個分。","src":"本科教室 第6回 p.124／栄冠への道 p.68"},{"id":"ri-n-18","s":"理科","topic":"第6回 月の形と動き","q":"地球の直径（ちょっけい）は、月の直径の約何倍？","a":"約4倍（地球4：月1）。13000÷3500＝3.7…で、約4倍。","src":"栄冠への道 第6回 p.72／解答"},{"id":"ri-n-19","s":"理科","topic":"第6回 月の形と動き","q":"月の表面にあるくぼみを何という？ 何によってできた？","a":"クレーター。いん石がぶつかってできた。","src":"本科教室 第6回 p.124"},{"id":"ri-n-20","s":"理科","topic":"第6回 月の形と動き","q":"月の表面は、光が当たるときと当たらないときで、温度が100℃以上ちがう。なぜ？","a":"月の表面には空気（大気）がないから。※地球より温度の変化が大きい。","src":"本科教室 第6回 p.124／栄冠への道 解答"},{"id":"ri-n-21","s":"理科","topic":"第6回 月の形と動き","q":"新月から、形が変わっていく順に、月の名前を4つならべよう。","a":"新月 → 上げんの月 → 満月 → 下げんの月（→ 新月にもどる）。","src":"栄冠への道 第6回 p.68"},{"id":"ri-n-22","s":"理科","topic":"第6回 月の形と動き","q":"月の満ち欠けの周期（しゅうき）は約何日？ 新月から満月までは約何日？","a":"周期は約30日。新月から満月までは約15日。","src":"栄冠への道 第6回 p.68"},{"id":"ri-n-23","s":"理科","topic":"第6回 月の形と動き","q":"新月から上げんの月までは約何日？ 新月から下げんの月までは約何日？","a":"上げんの月まで約7〜8日、下げんの月まで約22〜23日。","src":"栄冠への道 第6回 p.68"},{"id":"ri-n-24","s":"理科","topic":"第6回 月の形と動き","q":"南の空に見える下げんの月は、右半分と左半分のどちらが光って見える？","a":"左半分。※右半分が光るのは上げんの月。","src":"本科教室 第6回 p.125"},{"id":"ri-n-25","s":"理科","topic":"第6回 月の形と動き","q":"満月の、月の出・南中（なんちゅう）・月の入りの時刻は？（24時制）","a":"月の出18時・南中0時・月の入り6時。夕方に出て、朝にしずむ。","src":"栄冠への道 第6回 p.69"},{"id":"ri-n-26","s":"理科","topic":"第6回 月の形と動き","q":"下げんの月の、月の出・南中（なんちゅう）・月の入りの時刻は？（24時制）","a":"月の出0時・南中6時・月の入り12時。※満月より6時間おそい。","src":"栄冠への道 第6回 p.69"},{"id":"ri-n-27","s":"理科","topic":"第6回 月の形と動き","q":"新月は、太陽とくらべてどの方角にある？ 月の出・南中（なんちゅう）・月の入りの時刻は？","a":"太陽と同じ方角。月の出6時・南中12時・月の入り18時で、太陽と同じ。光っている面が地球から見えないので見えない。","src":"栄冠への道 第6回 p.69・p.70"},{"id":"ri-n-28","s":"理科","topic":"第6回 月の形と動き","q":"月が満ち欠けして見えるのはなぜ？","a":"月が太陽の光を反射（はんしゃ）しながら地球のまわりを公転（こうてん）し、太陽・地球・月の位置関係が変わるから。※月の形そのものが変わるのではない。","src":"本科教室 第6回 p.130／栄冠への道 p.70"},{"id":"ri-n-29","s":"理科","topic":"第7回 電気の通り道","q":"回路で、電流はかん電池の何極から何極に向かって流れる？","a":"＋極から－極へ。","src":"本科教室 第7回 p.149"},{"id":"ri-n-30","s":"理科","topic":"第7回 電気の通り道","q":"かん電池と豆電球には、それぞれどんな働きがある？","a":"かん電池＝電気を押し出す働き。豆電球＝電流をじゃまする働き。","src":"本科教室 第7回 p.149／栄冠への道 p.82"},{"id":"ri-n-31","s":"理科","topic":"第7回 電気の通り道","q":"電流の大きさをはかる道具は何？ はかりたい回路に、どのようにつなぐ？","a":"電流計。回路に直列（ちょくれつ）につなぐ。＋端子（たんし）はかん電池の＋極側、－端子は－極側へ。","src":"本科教室 第7回 p.150〜151"},{"id":"ri-n-32","s":"理科","topic":"第7回 電気の通り道","q":"電流計で、いちばんはじめにつなぐ－端子（たんし）はどれ？ それはなぜ？","a":"5Aの－端子。大きい電流が流れていたとき、針がふりきれて電流計がこわれるのをふせぐため。","src":"本科教室 第7回 p.151／栄冠への道 解答"},{"id":"ri-n-33","s":"理科","topic":"第7回 電気の通り道","q":"5Aの－端子（たんし）につないだら、針が0.5A（500mA）より小さい所を指した。次はどの－端子につなぎかえる？","a":"500mAの－端子。※次に大きい電流をはかれる端子へ。いきなり50mAにしない。","src":"本科教室 第7回 p.151"},{"id":"ri-n-34","s":"理科","topic":"第7回 電気の通り道","q":"豆電球1個とかん電池1個で、豆電球に300mA流れた。かん電池を直列（ちょくれつ）に3個にすると、豆電球の電流は？ 明るさは？","a":"900mA（300×3）。明るくなる。","src":"本科教室 第7回 p.154／栄冠への道 p.83"},{"id":"ri-n-35","s":"理科","topic":"第7回 電気の通り道","q":"かん電池1個と豆電球1個で300mA流れた。豆電球を直列（ちょくれつ）に2個にすると、豆電球の電流は？ 明るさは？","a":"150mA（300÷2）。暗くなる。※直列の豆電球はふやすほど電流が小さくなる。","src":"本科教室 第7回 p.155／栄冠への道 p.83"},{"id":"ri-n-36","s":"理科","topic":"第7回 電気の通り道","q":"豆電球1個に、かん電池を並列（へいれつ）に2個つなぐ。豆電球の明るさは、かん電池1個のときとくらべてどうなる？","a":"変わらない（豆電球は300mAのまま）。かん電池1個あたりの電流は150mA（300÷2）になる。","src":"本科教室 第7回 p.156／栄冠への道 p.84・解答"},{"id":"ri-n-37","s":"理科","topic":"第7回 電気の通り道","q":"かん電池1個に、豆電球を並列（へいれつ）に3個つなぐ。豆電球1個の電流と、かん電池に流れる電流は？（1個ずつのときは300mA）","a":"豆電球1個あたり300mAのまま（明るさも変わらない）。かん電池には900mA（300×3）。","src":"本科教室 第7回 p.157／栄冠への道 p.84・解答"},{"id":"ri-n-38","s":"理科","topic":"第7回 電気の通り道","q":"豆電球を並列（へいれつ）に3個つないだ回路で、1個をソケットからはずすと、残りの豆電球はどうなる？","a":"同じ明るさのまま変わらない。※直列（ちょくれつ）のときは、ほかの豆電球も消える。","src":"栄冠への道 第7回 p.87〜88・解答"},{"id":"ri-n-39","s":"理科","topic":"第7回 電気の通り道","q":"かん電池1個・豆電球1個の回路で120mA流れた。同じ物で、かん電池3個を直列（ちょくれつ）、豆電球2個を直列にすると何mA？","a":"180mA。押し出す働きが3倍、じゃまする働きが2倍なので、120×3÷2＝180。","src":"栄冠への道 第7回 p.90・解答"},{"id":"sh-n-01","s":"社会","topic":"第5回 北陸と東海","q":"北陸地方にふくまれる4つの県は？","a":"新潟県・富山県・石川県・福井県。","src":"本科教室 第5回 p.60"},{"id":"sh-n-02","s":"社会","topic":"第5回 北陸と東海","q":"東海地方にふくまれるのは、どの県？（3つ。そのうち1つは南部だけ）","a":"静岡県・愛知県・岐阜県の南部。","src":"本科教室 第5回 p.60"},{"id":"sh-n-03","s":"社会","topic":"第5回 北陸と東海","q":"静岡県の南部、大井川の西側にある、茶の産地として有名な台地「まきのはら」を漢字で書こう。","a":"牧ノ原（まきのはら）。「牧」は牛へん。まん中の「ノ」はカタカナ。","src":"本科教室 第5回 p.66"},{"id":"sh-n-04","s":"社会","topic":"第5回 北陸と東海","q":"かじゅや茶、くわなど、木にできる作物を栽培（さいばい）している耕地を何という？ 漢字で書こう。","a":"樹園地（じゅえんち）。「樹」は木へん、「園」は口の形でかこむ（くにがまえ）。","src":"本科教室 第5回 p.66"},{"id":"sh-n-05","s":"社会","topic":"第5回 北陸と東海","q":"東海地方の静岡で、降水量が多いのは夏と冬のどちら？ 冬はどんな天気の日が多い？","a":"夏。冬は降水量が少なく、晴れの日が多い。","src":"本科教室 第5回 p.60–61"},{"id":"sh-n-06","s":"社会","topic":"第5回 北陸と東海","q":"雪が少しでも降った日を数えた「雪日数」。静岡は1年に何日？","a":"4日（1991〜2020年の平均）。札幌は124日。","src":"本科教室 第5回 p.63 表1"},{"id":"sh-n-07","s":"社会","topic":"第5回 北陸と東海","q":"北陸地方の耕地のうち、田はおよそ何%？ 北海道をのぞく全国では？","a":"北陸90%、全国（北海道をのぞく）67%（2024年）。北陸は9割、全国は7割未満。","src":"本科教室 第5回 p.64"},{"id":"sh-n-08","s":"社会","topic":"第5回 北陸と東海","q":"北陸地方が、春から秋の米づくりに力を入れているのはなぜ？「積雪（せきせつ）」という言葉を使おう。","a":"積雪期間が長く、稲をかり取ったあとに他の作物をつくるのが難しいから。","src":"本科教室 第5回 p.64"},{"id":"sh-n-09","s":"社会","topic":"第5回 北陸と東海","q":"北陸で、田にひく水が得やすかったのはなぜ？ 春に何が川に流れこむ？","a":"春になると、大量の雪どけ水が川に流れこむから。","src":"本科教室 第5回 p.64"},{"id":"sh-n-10","s":"社会","topic":"第5回 北陸と東海","q":"米の生産量がいちばん多い都道府県は？ 生産量も答えよう。","a":"新潟県、64万トン（2025年）。2位は北海道の58万トン。","src":"本科教室 第5回 p.64"},{"id":"sh-n-11","s":"社会","topic":"第5回 北陸と東海","q":"新潟県で米菓（べいか）（あられ・おかき・せんべい）づくりがさかんな理由を2つ。","a":"①原料の米の生産量が多い。②精米（せいまい）のときにくだけた米つぶを使える。","src":"本科教室 第5回 p.65 コラム","w":1},{"id":"sh-n-12","s":"社会","topic":"第5回 北陸と東海","q":"静岡の茶畑で、防霜（ぼうそう）ファンを使うのはなぜ？","a":"霜（しも）の害をふせぐため。茶の新芽は寒さに弱く、霜がおりると収穫（しゅうかく）量が減ったり品質（ひんしつ）が悪くなったりする。","src":"本科教室 第5回 p.66"},{"id":"sh-n-13","s":"社会","topic":"第5回 北陸と東海","q":"茶の生産量が多い県の1位と2位は？","a":"1位 鹿児島県（37%）、2位 静岡県（35%）（2024年）。","src":"本科教室 第5回 p.66 円グラフ"},{"id":"sh-n-14","s":"社会","topic":"第5回 北陸と東海","q":"農作物の「北限（ほくげん）」とは何のこと？","a":"あたたかい気候に向いた農作物を、どのくらい北の地域まで栽培できるかという限界。","src":"本科教室 第5回 p.67"},{"id":"sh-n-15","s":"社会","topic":"第5回 北陸と東海","q":"静岡県で多くつくられるみかん「青島温州（あおしまうんしゅう）」は、とってすぐには出荷しない。どうしてから出荷する？","a":"木箱に並べ、貯蔵庫（ちょぞうこ）で長い期間熟成（じゅくせい）させてから。食べごろは12月中旬（ちゅうじゅん）〜3月中旬。","src":"本科教室 第5回 p.67 コラム"},{"id":"sh-n-16","s":"社会","topic":"第6回 利根川と関東","q":"利根川が日本一なのは何？ 長さは日本で何番目？","a":"流域面積（りゅういきめんせき）が日本一。長さは2番目。","src":"本科教室 第6回 p.73"},{"id":"sh-n-17","s":"社会","topic":"第6回 利根川と関東","q":"川の「支流（しりゅう）」と「分流（ぶんりゅう）」のちがいは？","a":"支流＝本流にとちゅうから流れこむ川。分流＝本流のとちゅうから分かれる流れ。","src":"本科教室 第6回 p.73 注"},{"id":"sh-n-18","s":"社会","topic":"第6回 利根川と関東","q":"利根川の中流と下流は、それぞれどの2県の県境（けんざかい）を流れる？","a":"中流＝群馬県と埼玉県。下流＝茨城県と千葉県。","src":"本科教室 第6回 p.73／栄冠への道 p.52"},{"id":"sh-n-19","s":"社会","topic":"第6回 利根川と関東","q":"浅間山（あさまやま）のふもとにある、キャベツづくりで有名な群馬県の「つまごい村」を漢字で書こう。","a":"嬬恋村（つまごいむら）。「嬬」は女へん。","src":"本科教室 第6回 p.73–74"},{"id":"sh-n-20","s":"社会","topic":"第6回 利根川と関東","q":"利根川の下流、茨城県と千葉県の県境あたりに広がる、水がとても豊かな地域「すいごう」を漢字で書こう。","a":"水郷（すいごう）。「郷」の右は「阝（おおざと）」。","src":"本科教室 第6回 p.75"},{"id":"sh-n-21","s":"社会","topic":"第6回 利根川と関東","q":"利根川下流域でつくられる「早場米（はやばまい）」とは、どんな米？ なぜつくる？","a":"ふつうより早い時期（8月の終わりから）に収穫（しゅうかく）・出荷（しゅっか）する米。台風の被害（ひがい）をさけるため。","src":"本科教室 第6回 p.75"},{"id":"sh-n-22","s":"社会","topic":"第6回 利根川と関東","q":"1590年から江戸の町づくりを始めた人物はだれ？ 1603年に開かれた幕府（ばくふ）は？","a":"徳川家康（とくがわいえやす）。江戸幕府。","src":"本科教室 第6回 p.76 コラム"},{"id":"sh-n-23","s":"社会","topic":"第6回 利根川と関東","q":"古くから利根川につけられていたよび名「ばんどうたろう」を漢字で書こう。","a":"坂東太郎（ばんどうたろう）。「坂」は土へん。","src":"本科教室 第6回 p.77"},{"id":"sh-n-24","s":"社会","topic":"第6回 利根川と関東","q":"徳川家康が利根川の流れを変える工事を始めたのは何のため？ 工事が終わったのは何年？","a":"江戸の町を洪水（こうずい）からまもるため。1654年（1590年から60年以上かかった）。","src":"本科教室 第6回 p.77"},{"id":"sh-n-25","s":"社会","topic":"第6回 利根川と関東","q":"利根川などの川岸に多く整備された「河岸（かし）」とは何？","a":"川につくられた、船の荷物を積みおろしする場所。","src":"本科教室 第6回 p.77 注"},{"id":"sh-n-26","s":"社会","topic":"第6回 利根川と関東","q":"1947年9月の台風のあと、利根川の上流に建設されたダム。洪水を防ぐほかに、何に役立っている？","a":"川の水の流量を調節して、生活用水・工業用水・農業用水を安定して届けること。","src":"本科教室 第6回 p.78"},{"id":"sh-n-27","s":"社会","topic":"第7回 三陸と東北","q":"三陸海岸の「三陸」は、今のどの3県にあたる？","a":"青森県・岩手県・宮城県（昔の陸奥（むつ）・陸中・陸前）。","src":"本科教室 第7回 p.84 注"},{"id":"sh-n-28","s":"社会","topic":"第7回 三陸と東北","q":"海につき出た陸地の先の部分「みさき」を漢字で書こう。","a":"岬（みさき）。山へんに「甲」。","src":"本科教室 第7回 p.85 注"},{"id":"sh-n-29","s":"社会","topic":"第7回 三陸と東北","q":"暖流と寒流のように、性質のちがう2つの海水が接する海域「しおめ」を漢字で書こう。","a":"潮目（しおめ）。「潮」はさんずい。「湖」と書かない。","src":"本科教室 第7回 p.86"},{"id":"sh-n-30","s":"社会","topic":"第7回 三陸と東北","q":"暖流と寒流がぶつかる「しおめ」が、よい漁場になるのはなぜ？","a":"プランクトンが多く発生し、それを食べる魚が集まるから。暖かい海水を好む魚と冷たい海水を好む魚の両方が集まり、種類も多い。","src":"本科教室 第7回 p.86"},{"id":"sh-n-31","s":"社会","topic":"第7回 三陸と東北","q":"魚や貝、海藻（かいそう）などを人工的に育てる仕事「ようしょく業」を漢字で書こう。","a":"養殖業（ようしょくぎょう）。「殖」の左は「歹（がつへん）」。木へんの「植」と書かない。","src":"本科教室 第7回 p.86 注"},{"id":"sh-n-32","s":"社会","topic":"第7回 三陸と東北","q":"三陸海岸の湾（わん）と瀬戸内海（せとないかい）の湾は、どちらもかきのようしょくがさかん。共通する海の特色は？","a":"湾の中の波が静かなこと。","src":"本科教室 第7回 p.87 社会探検"},{"id":"sh-n-33","s":"社会","topic":"第7回 三陸と東北","q":"津波（つなみ）は、陸に近づいて海底が浅くなるとどうなる？ V字型の湾の奥（おく）では？","a":"高さが増す。湾の奥では津波のエネルギーが集まり、さらに高くなる。","src":"本科教室 第7回 p.85／栄冠への道 p.67"},{"id":"sh-n-34","s":"社会","topic":"第7回 三陸と東北","q":"三陸海岸の沖（おき）で地震が起こりやすいのは、どのプレートが、どのプレートの下にしずみこむから？","a":"海側の太平洋プレートが、陸の北アメリカプレートの下にしずみこむから。ひずみが限界になり、もとにもどろうとするときに地震が起きる。","src":"栄冠への道 第7回 p.66・解答 p.10–11"},{"id":"sh-n-35","s":"社会","topic":"第7回 三陸と東北","q":"三陸海岸の人々は、江戸時代と明治時代、内陸の町や仙台方面とどうやって行き来した？","a":"江戸時代＝歩いて北上高地をこえた。明治時代＝塩釜（しおがま）港・石巻港と結ぶ汽船（きせん）。","src":"本科教室 第7回 p.88"},{"s":"理科","topic":"第6回 月の形と動き","img":["img/tsuki_jogen_q.jpg"],"q":"南の空に見えるとき、この月は右半分・左半分のどちらが光って見える？ この月の名前は？","a":"右半分。上げんの月（上弦の月）。","aimg":"img/tsuki_katachi.jpg","src":"本科教室 理科 第6回 p.128・p.125","id":"fig-8"},{"s":"理科","topic":"第6回 月の形と動き","img":["img/tsuki_jogen_q.jpg"],"q":"あ（東からのぼる）・い（南の空）・う（西にしずむ）の時刻を、0時・6時・12時・18時からえらぼう。","a":"あ＝12時、い＝18時、う＝0時。月が東→南→西へ動くのに6時間ずつかかる。","aimg":"img/tsuki_jogen.jpg","src":"本科教室 理科 第6回 p.128","id":"fig-9"},{"s":"社会","topic":"第6回 利根川と関東","img":["img/h72_map_q.jpg"],"q":"地図のまん中を流れて太平洋に出る川 コ の名前は？","a":"利根川。","src":"本科教室 社会 第6回 p.72","id":"fig-10"},{"s":"社会","topic":"第6回 利根川と関東","img":["img/h72_map_q.jpg"],"q":"コ の川がはじまる所（源流部）にある、ア の山脈の名前は？","a":"越後山脈。","src":"本科教室 社会 第6回 p.72","id":"fig-11"},{"s":"社会","topic":"第6回 利根川と関東","img":["img/h72_map_q.jpg"],"q":"コ の川から分かれて南へ流れる、ケ の川の名前は？","a":"江戸川。","src":"本科教室 社会 第6回 p.72","id":"fig-12"},{"s":"社会","topic":"第6回 利根川と関東","img":["img/h72_map_q.jpg"],"q":"コ の川が海に出る所にある、サ の市の名前は？","a":"銚子市。","src":"本科教室 社会 第6回 p.72","id":"fig-13"},{"s":"理科","topic":"第7回 電気の通り道","img":["img/h148_hikaru_q.jpg"],"q":"あ〜か のうち、豆電球が光るものをすべて答えよう。","a":"あ・い・う。え は導線がとちゅうで切れている、お は導線が2本とも＋極側、か は－極にきちんとつながっていない。＋極→豆電球→－極がひとつながりなら光る。","src":"本科教室 理科 p.148","id":"fig-14"},{"s":"理科","topic":"第7回 電気の通り道","img":["img/h149_tooru_q.jpg"],"q":"図の物のうち、電気を通す物をすべて答えよう。","a":"鉄くぎ・10円玉・1円玉・5円玉（金属）。ガラス・プラスチック・木・ゴムは通さない。","src":"本科教室 理科 p.149","id":"fig-15"},{"s":"理科","topic":"第7回 電気の通り道","img":["img/h153_kigou_q.jpg"],"q":"ア〜エ の回路記号は、それぞれ何を表す？","a":"ア かん電池、イ 豆電球、ウ スイッチ、エ 電流計。かん電池の記号は長い方が＋極。","aimg":"img/h153_kigou_c.jpg","src":"本科教室 理科 p.153","id":"fig-16"},{"s":"理科","topic":"第7回 電気の通り道","img":["img/h150_tsunagi_q.jpg"],"q":"カ・キ は、かん電池2個のつなぎ方。それぞれ直列つなぎ・並列つなぎのどちら？","a":"カ＝直列つなぎ（電気の通り道が1つ）、キ＝並列つなぎ（とちゅうで2つに分かれる）。","src":"本科教室 理科 p.150","id":"fig-17"},{"s":"社会","topic":"第7回 三陸と東北","img":["img/h84_map_q.jpg"],"q":"あ・い の地名と、う の海岸の名前は？","a":"あ 鮫角（さめかど）、い 牡鹿半島（おしかはんとう）、う 三陸海岸。","aimg":"img/h84_map_c.jpg","src":"本科教室 社会 p.84","id":"fig-18"},{"s":"社会","topic":"第7回 三陸と東北","img":["img/h84_map_q.jpg"],"q":"う の海岸の南半分のように、山地が海にせまり、岬と湾が次々にあらわれる海岸を何という？","a":"リアス海岸。","src":"本科教室 社会 p.84–85","id":"fig-19"},{"s":"社会","topic":"第7回 三陸と東北","img":["img/e62_gyokou_q.jpg"],"q":"あ〜お の漁港の名前は？","a":"あ 八戸港、い 大船渡港、う 気仙沼港、え 女川港、お 石巻港。いちばん北が八戸港、いちばん南が石巻港。","aimg":"img/e62_gyokou.jpg","src":"栄冠への道 p.62","id":"fig-20"},{"s":"社会","topic":"第7回 三陸と東北","img":["img/h91_yamase_q.jpg"],"q":"カ の風と、キ・ク・ケ の海流の名前は？","a":"カ やませ、キ 千島海流、ク 日本海流、ケ 対馬海流。やませは初夏に北東からふく、冷たくしめった風。","aimg":"img/h91_yamase.jpg","src":"本科教室 社会 p.91","id":"fig-21"},{"s":"社会","topic":"第7回 三陸と東北","img":["img/h91_yamase_q.jpg"],"q":"カ の風がふき続けると、夏にどんな被害が出る？ その被害を何という？","a":"夏の気温が上がらず、イネの実りが悪くなって、米のとれ高が減る。冷害。","src":"本科教室 社会 p.91","id":"fig-22"},{"s":"社会","topic":"第7回 三陸と東北","img":["img/h88_kotsu_q.jpg"],"q":"ア の鉄道、イ の道路、ウ の山地の名前は？","a":"ア 三陸鉄道リアス線、イ 三陸沿岸道路、ウ 北上高地。","aimg":"img/h88_kotsu.jpg","src":"本科教室 社会 p.88","id":"fig-23"}];
const examDeck = [{"id":"exam26-0","s":"国語","topic":"漢字の書き","q":"町のシュヨウな道路を地図で調べた。シュヨウを漢字で書こう。","a":"主要。「主」と「要」の両方を書けたら〇。","t":10},{"id":"exam26-1","s":"国語","topic":"物語の心情","q":"「初めての係でレンは手順表を握りしめていた。友達が隣に立つと、手順表を机に置いて話し始めた。」気持ちはどう変わった？","a":"例：最初は不安だったが、友達が隣に来て安心した。〇の目安は、はじめの不安と安心のきっかけ。","w":1},{"id":"exam26-2","s":"国語","topic":"本文に戻る","q":"「ユイは走り出しかけて止まった。前の子がくつひもを結び直していた。ユイはその子が立つまで待った。」なぜ止まった？ 根拠を一つ入れて答えよう。","a":"前の子がくつひもを結び直していたから。〇の目安は、結び直していたことが入る。","w":1},{"id":"exam26-3","s":"国語","topic":"抜き出し","q":"「橋のたもとに、小さな白い花が一輪さいていた。」花の色が分かる３字を、本文からそのまま抜き出そう。","a":"白い花。「白い」だけでは２字。本文の文字をそのまま使う。"},{"id":"exam26-4","s":"国語","topic":"漢字の書き","q":"教室で植物のヒョウホンを見た。ヒョウホンを漢字で書こう。","a":"標本。「標」の左は木へん。","t":10},{"id":"exam26-5","s":"国語","topic":"漢字の書き","q":"市の中心に広がるシガイチを歩いた。シガイチを漢字で書こう。","a":"市街地。「街」を「外」にしない。","t":10},{"id":"exam26-6","s":"国語","topic":"漢字の書き","q":"図書室の本をカンリする。カンリを漢字で書こう。","a":"管理。「理」の左は王の形。","t":10},{"id":"exam26-7","s":"国語","topic":"漢字の書き","q":"次の出番まで廊下でタイキする。タイキを漢字で書こう。","a":"待機。「待」はぎょうにんべん。","t":10},{"id":"exam26-8","s":"国語","topic":"漢字の書き","q":"審判の決定にフフクだった。フフクを漢字で書こう。","a":"不服。「服」は「幸福」の「福」と区別する。","t":10},{"id":"exam26-9","s":"国語","topic":"漢字の書き","q":"家族のコウフクを願う。コウフクを漢字で書こう。","a":"幸福。「福」は「不服」の「服」と区別する。","t":10},{"id":"exam26-10","s":"国語","topic":"語彙","q":"「この方法にはデメリットもある。」デメリットを漢字２字で言いかえよう。","a":"短所（欠点でも〇）。よくない点のこと。"},{"id":"exam26-11","s":"国語","topic":"語彙","q":"「発表に挑戦するチャンスを得た。」チャンスを漢字２字で言いかえよう。","a":"機会。何かをするのに都合のよいとき。"},{"id":"exam26-12","s":"国語","topic":"一文節","q":"「窓に うつる 景色を 見た。」で「窓に」がかかる先を、一文節で抜き出そう。","a":"うつる。「うつる景色を」と続けない。"},{"id":"exam26-13","s":"国語","topic":"一文節","q":"「明るい 声で 名前を よんだ。」で「明るい」がかかる先を、一文節で抜き出そう。","a":"声で。助詞「で」までが一文節。"},{"id":"exam26-14","s":"国語","topic":"物語の心情","q":"「ミオは負けたあと目をふせた。『次は最後まで走る』と言って、翌朝はいつもより早く練習に来た。」翌朝の行動にはどんな気持ちが表れた？","a":"負けたくやしさを力にして、次はもっとよい結果を出したい気持ち。〇の目安は「次に向けてがんばりたい」がある。","w":1},{"id":"exam26-15","s":"国語","topic":"情景と根拠","q":"「店じまいの音が通りから消えた。街灯の下で、ぼくだけが友達を待っていた。」通りが静かになったと分かる表現を、一文で抜き出そう。","a":"店じまいの音が通りから消えた。","w":1},{"id":"exam26-16","s":"算数","topic":"計算と検算","q":"720÷8−6×7＝？ かけ算・わり算から先に。","a":"48。90−42＝48。48＋42＝90で検算。","t":30},{"id":"exam26-17","s":"算数","topic":"時刻と単位","q":"1時間18分は何分？","a":"78分。1時間を60分にして18分をたす。","t":15},{"id":"exam26-18","s":"算数","topic":"速さの単位","q":"時速43.2 kmは分速何m？","a":"分速720 m。43,200 m÷60。０の形まで見直す。","t":20},{"id":"exam26-19","s":"算数","topic":"速さの単位","q":"分速840 mは秒速何m？","a":"秒速14 m。１分は60秒なので840÷60。","t":20},{"id":"exam26-20","s":"算数","topic":"問われた単位","q":"分速600 mの自転車が25分で進む道のりは何km？","a":"15 km。600×25＝15,000 m。最後に1,000で割る。"},{"id":"exam26-21","s":"算数","topic":"小数と逆算","q":"1.8×□−4.5＝8.1。□はいくつ？","a":"7。8.1＋4.5＝12.6、12.6÷1.8＝7。元の式に戻して確かめる。"},{"id":"exam26-22","s":"算数","topic":"最後の一手","q":"6、10、14、…、46。6と46をふくめて何個ある？","a":"11個。(46−6)÷4＝10は間の数。最初の１個をたす。"},{"id":"exam26-23","s":"算数","topic":"初めてそろう","q":"アキはカード０枚、ユウは20枚。明日からアキは毎日８枚、ユウは毎日４枚増える。アキが初めてユウより多くなるのは何日目？","a":"６日目。１日４枚ずつ差が縮まり、５日目は同じ。こえるのは次の日。"},{"id":"exam26-24","s":"理科","topic":"表から比例","q":"同じ濃さの食塩水。20 mLから食塩は0.6 g、40 mLから1.2 g残った。100 mLなら？","a":"3 g。100÷20＝5、0.6×5＝3。単位はg。"},{"id":"exam26-25","s":"理科","topic":"日をまたぐ時刻と星","q":"ある星を21時と翌１時に観察した。間は何時間？ １時間に15°動くとすると何度動いた？","a":"４時間、60°。21時→24時は３時間、そこから１時間。"},{"id":"exam26-26","s":"理科","topic":"表から逆算","q":"同じ条件で粉２gから気体が18 mL、粉４gから36 mL出た。54 mL出すには粉は何g？","a":"６g。54÷18＝３倍なので、２×３。"},{"id":"exam26-27","s":"理科","topic":"グラフの差","q":"ボールを20 cmから落とすと12 cm、40 cmからだと24 cmはね返った。比例するとき、60 cmから落とすと、落とした高さより何cm低くはね返る？","a":"24 cm。はね返りは12×3＝36 cm。求めるのは差なので60−36。"},{"id":"exam26-28","s":"理科","topic":"北の空の星","q":"北を向いて、北極星の上にある星を観察した。時間が少したつと、その星は右と左のどちらへ動いて見える？","a":"左。北の空では、北極星のまわりを反時計回りに動く。"},{"id":"exam26-29","s":"理科","topic":"星の向き","q":"同じ北の空を同じ向きのカメラで撮った。北極星の右にあったカシオペヤ座が90°動いて見えると、北極星の上・下のどちら？","a":"上。右から反時計回りに90°進むと上。"},{"id":"exam26-30","s":"理科","topic":"星の位置と方角","q":"写真を２枚比べると、星が小さな範囲で動かず、ほかの星がその星を中心に弧をえがいた。日本の観察なら、カメラは主にどちらを向き、中心は何という星？","a":"北、北極星。ほとんど動かない星と弧の中心が手がかり。"},{"id":"exam26-31","s":"理科","topic":"こん虫の育ち方","q":"チョウは卵→幼虫→さなぎ→成虫の順で育つ。この育ち方を漢字で書こう。","a":"完全変態。さなぎになる段階がある。"},{"id":"exam26-32","s":"社会","topic":"農業機械","q":"田植えの前、土をたがやすために使う機械と、実った稲を刈ってもみを取る機械を順に答えよう。","a":"トラクター、コンバイン。刈り取りと脱穀をするのがコンバイン。"},{"id":"exam26-33","s":"社会","topic":"地理の漢字","q":"対馬海峡から日本海に流れこむ暖流を漢字で書こう。","a":"対馬海流。「対島」と書かない。","t":10},{"id":"exam26-34","s":"社会","topic":"農業機械","q":"前に刈り取り部分があり、刈った稲からもみを取り分ける機械は？","a":"コンバイン。苗を植える機械は田植え機。"},{"id":"exam26-35","s":"社会","topic":"地理の漢字","q":"甲府盆地を流れる笛吹川などの水を集め、静岡県で駿河湾に注ぐ川を漢字で書こう。","a":"富士川。","t":10},{"id":"exam26-36","s":"社会","topic":"地理の漢字","q":"静岡県の伊豆半島と御前崎の間に広がる湾を漢字で書こう。","a":"駿河湾（するがわん）。","t":10},{"id":"exam26-37","s":"社会","topic":"用語","q":"池や湖の水面が、ふえた藍藻などで緑色になる現象を何という？","a":"アオコ。"},{"id":"exam26-38","s":"社会","topic":"用語","q":"磁石の力で車体を浮かせて走る、日本の超電導方式の列車は何とよばれる？","a":"超電導リニア（リニアモーターカー）。"},{"id":"exam26-39","s":"社会","topic":"条件を読み切る","q":"地点Aの降水量は夏180 mm・冬260 mm、地点Bは夏210 mm・冬45 mm。冬の降水量が夏より多い地点と、その差は？","a":"地点A、80 mm。指定された「冬が夏より多い」と「差」の両方を確かめる。"},{"id":"ko-e-01","s":"国語","topic":"漢字の書き","q":"一日じゅうさがしたが、トロウに終わった。トロウを漢字で書こう。","a":"徒労（むだな苦労）。「徒」は、ぎょうにんべんに「走」。形の似た「従」と区別する。","src":"第6回公開模試 [一]6（無答）・解説","t":10},{"id":"ko-e-02","s":"国語","topic":"漢字の書き","q":"江戸時代のマッキに、この橋がかけられた。マッキを漢字で書こう。","a":"末期（終わりのころ）。「週末」の「末」。上の横線が長い。「未」と書かない。","src":"第6回公開模試 [一]9（無答）・解説","t":10},{"id":"ko-e-03","s":"国語","topic":"漢字の書き","q":"クラスで、読んだ本の数をキョウソウする。キョウソウを漢字で書こう。","a":"競争。走る速さをくらべるときは「競走」。「完」や「観」と書かない。","src":"第4回公開模試 [一]5（「完走」系の字を書いた）・漢検総点検（競走）","t":10},{"id":"ko-e-04","s":"国語","topic":"漢字の書き","q":"その映画は、大人気をハクした。ハクを漢字で書こう。","a":"博（博した）。「博物館」の「博」。「白」と書かない。","src":"第4回公開模試 [一]6（「白」と書いた）","t":10},{"id":"ko-e-05","s":"国語","topic":"漢字の書き","q":"町でスポーツのサイテンが開かれた。サイテンを漢字で書こう。","a":"祭典。「夏祭り」の「祭」と、「辞典」の「典」。「展覧会」の「展」と書かない。","src":"第5回公開模試 [一]（×）・朝の模試ドリル10日目（11/25・「祭展」と書いた）","t":10},{"id":"ko-e-06","s":"国語","topic":"漢字の書き","q":"この村には、昔の大工のシソンがくらしている。シソンを漢字で書こう。","a":"子孫。「孫」は「まご」と読む字。","src":"第5回公開模試 [一]（×）","t":10},{"id":"ko-e-07","s":"国語","topic":"漢字の書き","q":"春になって、アタタかい日がふえた。アタタかいを漢字で書こう。","a":"暖かい。「暖」は日へん。「暖かい日」と覚える。","src":"10/31育成テスト [五]（×）・漢検の漢字表（暖）","t":10},{"id":"ko-e-08","s":"国語","topic":"漢字の書き","q":"弓で矢をハナつ。ハナつを漢字で書こう。","a":"放つ。「放課後」の「放」。右がわは「攵（ぼくづくり）」。","src":"第3回公開模試 [一]5（×）","t":10},{"id":"ko-e-09","s":"国語","topic":"漢字の書き","q":"電車が、駅の手前でテイシした。テイシを漢字で書こう。","a":"停止。「停」はにんべん。「停車」の「停」。","src":"10/31育成テスト [五]（×）・漢検の漢字表（停）","t":10},{"id":"ko-e-10","s":"国語","topic":"漢字の読み","q":"この海岸は遠浅だ。「遠浅」の読みは？","a":"とおあさ。二字とも訓読み。「えんあさ」としない。","src":"第4回公開模試 [一]9（「えんあさ」と書いた）","t":5},{"id":"ko-e-11","s":"国語","topic":"漢字の読み","q":"おかし代を、二人で折半する。「折半」の読みは？","a":"せっぱん。「よりはん」としない。","src":"第4回公開模試 [一]7（「よりはん」と書いた）","t":5},{"id":"ko-e-12","s":"国語","topic":"語彙","q":"「パソコンは、調べ学習に欠かせないツールだ。」ツールを漢字二字で言いかえよう。","a":"道具（手段でも〇）。","src":"第6回公開模試 [二]問二1（×）・解説"},{"id":"ko-e-13","s":"国語","topic":"語彙","q":"「夏休みのプランを立てる。」プランを漢字二字で言いかえよう。","a":"計画。","src":"第6回公開模試 [二]問二2（×）・解説"},{"id":"ko-e-14","s":"国語","topic":"語彙","q":"「チームのミッションは、時間内にゴールすることだ。」ミッションを漢字二字で言いかえよう。","a":"使命。","src":"第6回公開模試 [二]問二5（×）・解説"},{"id":"ko-e-15","s":"国語","topic":"語彙","q":"「赤ちゃんが、おぼつかない足どりで歩く。」の「おぼつかない」とはどういう意味？","a":"たよりない様子。","src":"第6回公開模試 [二]問一2（失点）・解説","w":1},{"id":"ko-e-16","s":"国語","topic":"語彙","q":"「朝はいつも、せわしない。」の「せわしない」とはどういう意味？","a":"いそがしい様子（漢字で「忙しない」）。「ない」は打ち消しではなく、意味を強めている。","src":"第6回公開模試 [二]問一5（失点）・解説","w":1},{"id":"ko-e-17","s":"国語","topic":"語彙","q":"「妹の、あどけない寝顔（ねがお）。」の「あどけない」とはどういう意味？","a":"むじゃきでかわいい様子。","src":"第6回公開模試 [二]問一3（失点）・解説","w":1},{"id":"ko-e-18","s":"国語","topic":"一文節","q":"「きのう 駅前で 買った 本を 読んだ。」で「駅前で」がかかる先を、一文節で抜き出そう。","a":"買った。「駅前で買った」とつなげて確かめる。「読んだ」ではない。","src":"第5回公開模試 [三]修飾語（×）の型・自作の文"},{"id":"ko-e-19","s":"国語","topic":"一文節","q":"「白い ねこが ゆっくり へいの 上を 歩く。」で「ゆっくり」がかかる先を、一文節で抜き出そう。","a":"歩く。「ゆっくり歩く」とつなげて確かめる。","src":"第5回公開模試 [三]修飾語（×）の型・自作の文"},{"id":"ko-e-20","s":"国語","topic":"抜き出し","q":"「朝、外に出ると、はく息が白くなった。屋根のはしには、つららが下がっていた。ぼくはランドセルをせおい直して、学校へ歩き出した。」「寒い」という言葉を使わずに寒さを表している一文を二つさがし、それぞれはじめの五字を書こう。","a":"「朝、外に出」と「屋根のはし」。「、」も一字に数える。","src":"第5回育成テスト [二]問五（白紙）の型・自作の文"},{"id":"ko-e-21","s":"国語","topic":"抜き出し","q":"「『もう二度と、あの池には近づかない。』ケンはそう決めて、遠回りの道を歩いた。」「そう」が指す内容を、本文から抜き出そう。","a":"もう二度と、あの池には近づかない。かぎかっこの中の言葉を、そのまま使う。","src":"第6回公開模試 [四]問五（「そう」の中身・白紙）の型・自作の文"},{"id":"ko-e-22","s":"国語","topic":"物語の心情","q":"「ソウタは『大きな箱がとどいたよ』と聞いて、玄関（げんかん）へ走った。開けてみると、中身は近所の人からもらった野菜だった。ソウタは小さくため息をついた。」ソウタの気持ちの変化を、「はじめは〜が、…になった。」の形で書こう。","a":"例：はじめは何かいいものがとどいたと期待していたが、中身が野菜だったのでがっかりした。〇の目安は、はじめの「期待」と、あとの「がっかり」の両方。","src":"本科教室 第11回 p.165・p.167探求の型／栄冠 p.158（期待→がっかり）・自作の文","w":1},{"id":"ko-e-23","s":"国語","topic":"物語の心情","q":"「テストが返ってくると、リクはくちびるをぎゅっとかんで下を向いた。点数のらんには、赤い字で四十点と書いてあった。」このときのリクの気持ちは？","a":"例：点数が低くて、くやしい（悲しい）気持ち。〇の目安は、点数が低かったことと、くやしい・悲しいなどの気持ちの言葉。","src":"本科教室 第11回 p.158（表情・態度から類推）・自作の文","w":1},{"id":"ko-e-24","s":"国語","topic":"物語の心情","q":"「『べつに、いいけど。』ユキはそっけなく言った。でも、もらったキーホルダーを、帰るまでずっと手の中でにぎっていた。」ユキの本当の気持ちは？","a":"例：本当はうれしい気持ち。〇の目安は「うれしい」などの気持ちがあり、ずっとにぎっていた行動を手がかりにしていること。","src":"本科教室 第10回 p.149（「べつに。」）・第11回 p.158・自作の文","w":1},{"id":"ko-e-25","s":"国語","topic":"物語の心情","q":"「『ばかだなあ。そこは、ねこの通り道だよ。』と言われて、ネズミははっとした。そして、あわてて穴にかけこんだ。」ネズミがあわてたのはなぜ？","a":"自分がねこに食べられるかもしれないと気づいたから。〇の目安は「自分の身があぶない」と気づいたこと。「ばかと言われて腹が立った」は×。","src":"第5回育成テスト [二]問三（言われた言葉に引っぱられて×）の型・自作の文","w":1},{"id":"ko-e-26","s":"国語","topic":"物語の心情","q":"「ケンは、新しい白いシャツを見下ろした。どろがついたら、母さんにしかられる。ボールが飛んでくるたびに、ケンはどぎまぎした。」ケンがどぎまぎしたのはなぜ？","a":"シャツがよごれたら、母さんにしかられると思ったから。〇の目安は「よごれる」と「しかられる」の両方。","src":"第6回公開模試 [四]問四（どぎまぎの心情・白紙）の型・自作の文","w":1},{"id":"ko-e-27","s":"国語","topic":"物語の心情","q":"「弟がころんで泣き出すと、兄はだまって自分のハンカチを出し、ひざのどろをふいてやった。」兄はどんな性格？","a":"例：やさしい（思いやりがある）性格。〇の目安は、弟を気づかう行動から考えていること。","src":"栄冠への道 第12回 p.173・解答p.47の型・自作の文","w":1},{"id":"ko-e-28","s":"国語","topic":"物語の心情","q":"「雨で遠足が中止になった。マイは『つまらない』と窓の外をにらんだ。弟は『家でおべんとうを食べよう』とはしゃいだ。」二人の気持ちのちがいを、「マイは〜が、弟は〜。」の形で書こう。","a":"例：マイは遠足が中止になってつまらない気持ちだが、弟は家でおべんとうを食べるのを楽しみにしている。〇の目安は、二人の両方に気持ちの言葉が入っていること。","src":"第5回育成テスト [一]問五（二人のちがい・部分点）の型・自作の文","w":1},{"id":"ko-e-29","s":"国語","topic":"物語の心情","q":"「なかなか言えなかった『ごめんね』を、やっと友だちに言えた。帰り道、見上げた空はすっきりと晴れていた。」この空の様子には、どんな気持ちが表れている？","a":"例：あやまることができて、すっきりした（さわやかな）気持ち。〇の目安は、すっきり・ほっとした・さわやかなどの明るい気持ち。","src":"本科教室 第9回 p.122（晴れた空→さわやかな気持ち）・自作の文","w":1},{"id":"ko-e-30","s":"国語","topic":"理由の記述","q":"「ハルトは、飛んでくるボールをひょいひょいとよけた。それを見たユウは、『あいつ、本当は運動が得意なんだ』と思った。」ユウがそう思った理由を、「〜から。」で書こう。","a":"ハルトがボールをすばやくよけたから。〇の目安は、ボールをよけたことが入り、文の終わりが「から。」になっていること。","src":"第6回公開模試 [四]問二（理由・白紙）の型・解説・自作の文","w":1},{"id":"ko-e-31","s":"国語","topic":"理由の記述","q":"「『そのパンはやめておけよ。』と兄が言った。『きのうの夜から、テーブルに出しっぱなしだったんだ。』」兄がやめておけと言った理由を、「〜から。」で書こう。","a":"パンが、きのうの夜からテーブルに出しっぱなしだったから。〇の目安は、本文の「出しっぱなし」を使っていること。自分の想像で理由を作らない。","src":"第5回育成テスト [一]問三(2)（本文の根拠を使わず×）の型・自作の文","w":1},{"id":"ko-e-32","s":"国語","topic":"理由の記述","q":"「犬にほえられたねこは、するすると木のてっぺんまで登った。犬は木の下で、ぐるぐる回るだけだった。」ねこが木に登ったのはなぜ？ 十〜二十字で書こう。","a":"例：犬が来られない高い所へにげるため。〇の目安は「犬からにげる」ことと、安全な場所に行くこと。","src":"第5回育成テスト [二]問六（理由・白紙）の型・自作の文","w":1},{"id":"sa-e-01","s":"算数","topic":"0と桁","q":"1440÷9＝？ 先に「だいたい何百か」を言ってから。","a":"160。9×100＝900、9×200＝1800なので百いくつになる。160×9＝1440で検算。","src":"2/21 第1回育成テスト[10](1) 商の0を落として16と書いた"},{"id":"sa-e-02","s":"算数","topic":"0と桁","q":"4800÷80＝？","a":"60。0を1つずつ消して480÷8＝60。60×80＝4800で検算。","src":"11/15 第5回育成テスト[6](1) 900÷60を9÷6にした"},{"id":"sa-e-03","s":"算数","topic":"0と桁","q":"37300÷600の商とあまりは？","a":"商62、あまり100。0を2つずつ消して373÷6＝62あまり1。消した0をあまりにもどして100。600×62＋100＝37300で検算。","src":"3/07 第2回育成テスト[4](4) 消した0をあまりにもどさなかった"},{"id":"sa-e-04","s":"算数","topic":"小数点の位置","q":"6.4×7＝？","a":"44.8。64×7＝448。6.4は小数点の右に1けたなので、答えも小数点の右に1けた。6×7＝42に近いので大きさも合う。","src":"8/21 夏期講習特別テスト[1](1) 7.2×6を432と書いた"},{"id":"sa-e-05","s":"算数","topic":"計算と検算","q":"63.2−8.47＝？ 位をそろえて筆算。","a":"54.73。63.20−8.47として計算する。54.73＋8.47＝63.2で検算。","src":"4/18 第4回育成テスト[5](4) くり下がりで貸した1を引き忘れた","t":30},{"id":"sa-e-06","s":"算数","topic":"小数と逆算","q":"□÷3.5＝6あまり0.4。□はいくつ？","a":"21.4。□＝3.5×6＋0.4＝21＋0.4。わる数×商＋あまり。","src":"11/7 第6回公開模試[1](4) 小数の逆算（商とあまり）"},{"id":"sa-e-07","s":"算数","topic":"時刻と単位","q":"1時間20分は何秒？","a":"4800秒。1時間20分＝80分。80×60＝4800。","src":"11/7 第6回公開模試[1](6) 時間の単位","t":15},{"id":"sa-e-08","s":"算数","topic":"速さの単位","q":"分速1200 mは秒速何m？","a":"秒速20 m。1200÷60は、0を1つずつ消して120÷6＝20。20×60＝1200で検算。","src":"11/15 第5回育成テスト[6](1) 分速900 m→秒速を1.5と書いた","t":20},{"id":"sa-e-09","s":"算数","topic":"問われた単位","q":"4500 mを18分で走る速さで1時間走ると、何km進む？","a":"15 km。4500÷18＝250で分速250 m。250×60＝15000で15000 m。答えはkmなので÷1000。","src":"11/15 第5回育成テスト[5](3) 12000 mのままkmのらんに書いた"},{"id":"sa-e-10","s":"算数","topic":"面積の単位","q":"1 haは何m²？","a":"10000 m²。1 haは1辺100 mの正方形の面積。100×100＝10000。","src":"5/23 第6回育成テスト[6](3) 1 ha＝1辺100 mの正方形"},{"id":"sa-e-11","s":"算数","topic":"正方形の3つの関係","q":"面積が64 cm²の正方形がある。周りの長さは何cm？","a":"32 cm。64＝8×8なので1辺は8 cm（64÷4ではない）。周りは8×4＝32。","src":"5/23 第6回育成テスト[3](3)・[9](3) 正方形の面積と周りの取りちがえ"},{"id":"sa-e-12","s":"算数","topic":"1のちがい","q":"4、7、10、13、…と3ずつ増える。20番目の数は？","a":"61。1番目から20番目までに3を足す回数は20−1＝19回。4＋3×19＝61。","src":"7/18 第10回育成テスト 等差数列で番号が1ずれた"},{"id":"sa-e-13","s":"算数","topic":"1のちがい","q":"碁石を、たて8個・横8個の正方形にすきまなくならべた。その外側にもう1周ならべて、大きな正方形にする。外側の1周に碁石は何個いる？","a":"36個。1周ふやすと1辺は8＋2＝10個。10×4−4＝36（かどの4個を2回数えない）。","src":"7/18 第10回育成テスト 方陣で増えた後の1辺で数えなかった"},{"id":"sa-e-14","s":"算数","topic":"最後の一手","q":"1冊95円のノートを20冊買う予定だった。値下がりしていて、代金は1640円だった。1冊何円安くなっていた？","a":"13円。95×20＝1900、1900−1640＝260は20冊分の差。260÷20＝13で1冊分にもどす。","src":"3/07 第2回育成テスト[6](2)③ 20冊分の差で止めた"},{"id":"sa-e-15","s":"算数","topic":"全体を問う","q":"持っていたお金の半分より300円多く使ったら、残りは1200円になった。初めに持っていたお金は何円？","a":"3000円。残りの1200円に使いすぎた300円をたした1500円が、初めのお金の半分。1500×2＝3000。残りの1200円で止めない。","src":"4/18 第4回育成テスト[7](3) 全体ではなく残りを答えた"},{"id":"sa-e-16","s":"算数","topic":"条件を読み切る","q":"タクシー代は、はじめの1 kmまでが500円。1 kmをこえると、250 mごとに100円ずつ加わる（250 mに足りない分も100円）。2.2 km乗ると何円？","a":"1000円。1 kmをこえた分は1200 m。1200÷250＝4あまり200。あまりの200 mも1つと数えて5つ。500＋100×5＝1000。","src":"11/7 第6回公開模試[5] 階段料金"},{"id":"ri-e-01","s":"理科","topic":"表から逆算","q":"ベーキングパウダー60gから気体が2L出た（重さと気体の体積は比例する）。21L出すには、何g必要？","a":"630g。21÷2＝10.5倍なので、60×10.5＝630。※答えは重さ（g）。","src":"第6回公開模試 理科[4](4) 解説"},{"id":"ri-e-02","s":"理科","topic":"表から比例","q":"重そう8gから二酸化炭素（にさんかたんそ）が1L出る。二酸化炭素を10L出すには、重そうは何g？","a":"80g。10Lは1Lの10倍なので、8×10＝80。","src":"第6回公開模試 理科[4](6) 解説"},{"id":"ri-e-03","s":"理科","topic":"割合で比例","q":"材料100gに対して、ベーキングパウダーを4g入れる。材料が2250gなら、何g入れる？","a":"90g。2250÷100＝22.5倍、4×22.5＝90。","src":"第6回公開模試 理科[4](7) 解説"},{"id":"ri-e-04","s":"理科","topic":"比例を2回使う","q":"ベーキングパウダー300gに重そうが80g入っていて、二酸化炭素（にさんかたんそ）が10L出る。ベーキングパウダー90gでは、重そう何g・二酸化炭素何L？","a":"重そう24g・二酸化炭素3L。90÷300＝0.3倍。80×0.3＝24、10×0.3＝3。※前の問いの答え（90g）を次に使う。","src":"第6回公開模試 理科[4](7) 解説"},{"id":"ri-e-05","s":"理科","topic":"グラフの読み方","q":"温めた時間と、出た気体の量のグラフ。線が上がっている所と、水平（すいへい）な所では、それぞれ何がわかる？","a":"上がっている所＝気体が出ている。水平な所＝気体が出ていない。","src":"第6回公開模試 理科[4](1)(2) 解説"},{"id":"ri-e-06","s":"理科","topic":"星の等級","q":"等級（とうきゅう）が1ちがうと、明るさは2.5倍ちがう。1等星は3等星の何倍明るい？","a":"6.25倍。2.5×2.5＝6.25。※2.5×2＝5倍にしない。","src":"第6回公開模試 理科[2](5) 解説"},{"id":"ri-e-07","s":"理科","topic":"本当の明るさ","q":"同じ星を、きょりが2倍の所に置くと、見える明るさはどうなる？","a":"4で割った明るさになる（2×2＝4）。※2で割るのではない。","src":"第6回公開模試 理科[2](6) 解説"},{"id":"ri-e-08","s":"理科","topic":"明るさをくらべる","q":"星Cは「2等星の明るさを4で割った明るさ」。星Dは3等星で「2等星の明るさを2.5で割った明るさ」。明るいのはどちら？","a":"星D。4で割るより、2.5で割る方が、のこる明るさが大きい。","src":"第6回公開模試 理科[2](6)問2 解説"},{"id":"ri-e-09","s":"理科","topic":"日をまたぐ時刻と星","q":"北の空の星Aを20時に見た。そこから左回りに225度動いた位置に来るのは何時？","a":"次の日の11時。225÷15＝15時間、20時＋15時間＝35時→35－24＝11時。昼で太陽が出て明るいので、星Aは見えない。","src":"第5回育成テスト 理科[2](4) 採点メモ"},{"id":"ri-e-10","s":"理科","topic":"星の向き","q":"カシオペヤ座のWの両はしの辺をのばして交わる点と、北極星は、Wをはさんで同じ側？ 反対側？","a":"反対側。交わる点 → Wのまん中の星 → その先に北極星。※向きを選ぶ問題は、この線が北極星の方を向く形をさがす。","src":"本科教室 第5回 p.106／第5回育成テスト 理科[1](8)"},{"id":"ri-e-11","s":"理科","topic":"仮説をたしかめる","q":"カエルを池の近くのA地点で放すと池へ向かい、池の反対側のB地点で放すと、ばらばらに進んだ。「池から出る信号（しんごう）をたよりに進む」という考えが正しければ、B地点ではどうなるはず？","a":"B地点でも池の方向へ進むはず。ばらばらだったので、この考えは合わない（池までの道の特ちょうをたよりにしていると考えられる）。","src":"第6回公開模試 理科[3](2) 解説"},{"id":"sh-e-01","s":"社会","topic":"地理の漢字","q":"関東平野を流れ、利根川に合流する支流「きぬ川」を漢字で書こう。","a":"鬼怒川（きぬがわ）。「怒」は「奴」の下に「心」。","src":"本科教室 第6回 p.73","t":10},{"id":"sh-e-02","s":"社会","topic":"地理の漢字","q":"群馬県と長野県の県境にあり、ふもとでキャベツづくりがさかんな山「あさま山」を漢字で書こう。","a":"浅間山（あさまやま）。「浅」はさんずい、「間」は門がまえ。","src":"本科教室 第6回 p.73","t":10},{"id":"sh-e-03","s":"社会","topic":"地理の漢字","q":"かきの生産量が全国2位（2023年）で、三陸地方にふくまれる「みやぎ県」を漢字で書こう。","a":"宮城県（みやぎけん）。「城」は土へん。","src":"本科教室 第7回 p.84・p.87","t":10},{"id":"sh-e-04","s":"社会","topic":"地理の漢字","q":"利根川の下流で、千葉県との県境をつくる「いばらき県」を漢字で書こう。","a":"茨城県（いばらきけん）。「き」は「城」。「木」と書かない。","src":"本科教室 第6回 p.73","t":10},{"id":"sh-e-05","s":"社会","topic":"用語","q":"嬬恋村（つまごいむら）のキャベツのように、夏のすずしい気候を使って、ふつうはすずしい時期にとれる作物を育て、ほかの産地からの入荷（にゅうか）が少ない時期に出荷する栽培（さいばい）方法を何という？","a":"抑制栽培（よくせいさいばい）。ほかの産地が少ない時期なので、高い値段で取り引きされる。","src":"栄冠への道 解答 p.9〜10（第6回 学び直し②の解説）"},{"id":"sh-e-06","s":"社会","topic":"用語","q":"徳川家康が利根川の流れを変えた工事や、ダムの建設のように、洪水（こうずい）にならないようにすることを何という？","a":"治水（ちすい）。","src":"本科教室 第6回 p.81 シナジー"},{"id":"sh-e-07","s":"社会","topic":"条件を読み切る","q":"北陸で米づくりがさかんになった理由として「ふさわしくない」ものは？　ア 積雪期間が長く、冬に農業をするのが難しかった　イ 雪どけ水が豊富で、田にひく水が得やすかった　ウ 夏でもすずしい気候が、稲の栽培に適していた","a":"ウ。北陸は夏にひかく的気温が高くなることが稲に向いている。「ふさわしくない」に線を引いてから選ぶ。","src":"栄冠への道 第5回 p.48 ②問1(1)／本科教室 p.64","w":1},{"id":"sh-e-08","s":"社会","topic":"条件を読み切る","q":"関東地方の1都6県のうち、利根川の流域面積に「ふくまれていない」県は？","a":"神奈川県。ふくまれている県を答えないように、問いの最後まで読む。","src":"栄冠への道 第6回 p.56 ①問3(2)・解答 p.10"},{"id":"sh-e-09","s":"社会","topic":"条件を読み切る","q":"静岡県の台地や斜面（しゃめん）が冬でもあたたかい理由を「2つ」選ぼう。　ア 富士山などのマグマの熱で地面が温められる　イ 山地をこえて、しめった風がふきこむ　ウ 沖合いにあたたかい海流が流れている　エ 冬に晴れの日が多い","a":"ウ・エ。「2つ」選ぶ指示を守る。","src":"栄冠への道 第5回 p.47 ①問3（p.42・p.45のまとめ）","w":1},{"id":"sh-e-10","s":"社会","topic":"数字の読み取り","q":"東京に入荷されるキャベツの内訳（2024年）　1〜3月：愛知57%・千葉22%・神奈川15%　7〜9月：群馬76%・岩手14%・長野6%。愛知県産と群馬県産がいちばん多いのは、それぞれ何月〜何月？","a":"愛知県＝1〜3月（57%）、群馬県＝7〜9月（76%）（2024年）。群馬県の嬬恋村は標高が高く、夏でもすずしい。","src":"本科教室 第6回 p.74／栄冠への道 p.55"},{"id":"sh-e-11","s":"社会","topic":"数字の読み取り","q":"養殖のとれ高の割合・上位3つ（2023年）　ぶり類：鹿児島33%・愛媛14%・大分11%　かき類：広島60%・宮城14%・岡山8%　わかめ類：宮城51%・岩手27%・徳島7%　こんぶ類：北海道80%・岩手18%・神奈川0.2%。三陸地方でさかんに養殖されていると考えられるものを3つ。","a":"かき類・わかめ類・こんぶ類（2023年）。宮城県や岩手県が上位に入っているものを選ぶ。","src":"栄冠への道 第7回 p.68 ②問4・解答 p.12"},{"id":"sh-e-12","s":"社会","topic":"数字の読み取り","q":"耕地利用の割合（2024年・牧草地は省略）　ア 田67%・畑22%・樹園地8%　イ 田48%・畑31%・樹園地20%　ウ 田90%・畑8%・樹園地2%。ア〜ウは北陸地方・東海地方・北海道をのぞく全国のどれか。東海地方はどれ？","a":"イ（2024年）。樹園地（茶・みかん）の割合が大きいのが東海。ウが北陸、アが全国。","src":"栄冠への道 第5回 p.49 ②問4"},{"id":"sh-e-13","s":"社会","topic":"理由の記述","q":"茶やみかんの北限の線が、内陸部で曲がっているのはなぜ？「地形」にふれて書こう。","a":"内陸部は標高が高く、気温が低いから。〇の目安：「標高が高い」と「気温が低い」の両方が入る。「山が多い」だけでは足りない。","src":"第5回育成テスト 社会[3]問3 の正答／本科教室 第5回 p.67","w":1},{"id":"asa-01","s":"国語","topic":"朝ドリルの直し","q":"今年の「ゴール」を決める。「ゴール」を漢字2字のことばにしよう。","a":"目標。「終点」は電車などの行き止まりのこと。文の中でどんな意味かを考えて選ぶ。","src":"朝の模試ドリル10日目（11/25・「終点」と書いた）"},{"id":"asa-02","s":"国語","topic":"朝ドリルの直し","q":"この料理の「ルーツ」をさぐる。「ルーツ」を漢字2字のことばにしよう。","a":"起源（きげん）＝ものごとのはじまり。「最初」は順番のいちばん目のこと。","src":"朝の模試ドリル9日目（11/20・「最初」と書いた）"},{"id":"asa-03","s":"国語","topic":"朝ドリルの直し","q":"「モラル」を守って行動する。「モラル」を漢字2字のことばにしよう。","a":"道徳（どうとく）。","src":"朝の模試ドリル9日目（11/20・赤で書き足し）"},{"id":"asa-04","s":"国語","topic":"朝ドリルの直し","q":"新入生の「ういういしい」姿。「ういういしい」の意味は？","a":"なれていない感じが新鮮で、好ましい。","src":"朝の模試ドリル9日目（11/20・赤で書き足し）","w":1},{"id":"asa-05","s":"国語","topic":"朝ドリルの直し","q":"「ものものしい」警備。「ものものしい」の意味は？","a":"おおげさで、いかめしい。","src":"朝の模試ドリル9日目（11/20・赤で書き足し）","w":1},{"id":"asa-06","s":"国語","topic":"朝ドリルの直し","q":"図書館に名前をトウロクする。トウロクを漢字で書こう。","a":"登録。「登」の下は「豆」、「録」は金へん＋右がわ「彔」。形をていねいに。","src":"朝の模試ドリル10日目（11/25・字の形に赤丸）"},{"id":"asa-07","s":"社会","topic":"朝ドリルの直し","q":"鹿児島県の西に広がる海は？","a":"東シナ海。中国から見て東にあるので「東」がつくが、九州から見ると西の海。太平洋は九州の東・南がわ。","src":"朝の模試ドリル10日目（11/25・「太平洋」と書いた）／10/10模試"},{"id":"asa-08","s":"社会","topic":"朝ドリルの直し","q":"明石海峡大橋で本州と結ばれている島は？","a":"淡路島（兵庫県）。","src":"朝の模試ドリル9日目（11/20・赤で書き足し）／6/27模試"},{"id":"asa-09","s":"社会","topic":"朝ドリルの直し","q":"千葉県の大部分をしめる半島は？","a":"房総半島。","src":"朝の模試ドリル9日目（11/20・「半島」を赤で書き足し）／6/27模試"},{"id":"asa-10","s":"理科","topic":"朝ドリルの直し","q":"ふりこが1往復する時間を変える条件は？","a":"ふりこの長さ。長いほど1往復に時間がかかる。おもりの重さや、ふれはばを変えても時間は変わらない。","src":"朝の模試ドリル10日目（11/25・白紙）／6/27模試"},{"id":"asa-11","s":"算数","topic":"朝ドリルの直し","q":"Aさんは毎日8まいずつ、Bさんは毎日3まいずつカードを集める。今、Aさんは0まい、Bさんは25まい。明日から集めはじめると、AさんがBさんより初めて多くなるのは何日目？","a":"6日目。差は1日に5ずつちぢむ。25÷5＝5 → 5日目は同じ（40まいと40まい）。初めて多くなるのはその次の日。","src":"朝の模試ドリル9日目（11/20・「10日目」と書いた型）"},{"s":"社会","topic":"米づくりの機械","img":["img/kikai_ka.jpg"],"q":"この機械の名前は？ 米づくりのどの作業で使う？","a":"コンバイン。稲かり（かり取りと、もみを取る脱穀）。見分け方：機械の前に、稲をかり取る部品がある。","src":"第5回育成テスト 社会[2]問7の写真","id":"fig-0"},{"s":"社会","topic":"米づくりの機械","img":["img/kikai_ki.jpg"],"q":"この機械の名前は？ 米づくりのどの作業で使う？","a":"田植え機。田植え。見分け方：苗（なえ）をのせた台がついている。","src":"第5回育成テスト 社会[2]問7の写真","id":"fig-1"},{"s":"社会","topic":"米づくりの機械","img":["img/kikai_ku.jpg"],"q":"この機械の名前は？ 米づくりのどの作業で使う？","a":"トラクター。田おこし・しろかき。見分け方：機械の後ろに、土をたがやす部品がある。","src":"第5回育成テスト 社会[2]問7の写真","id":"fig-2"},{"s":"理科","topic":"星座の向き","img":["img/kashi_zu4.jpg","img/kashi_sentaku.jpg"],"q":"北の空で、点線の四角（北極星の左上）にWの形の星座（カシオペヤ座）が見えた。四角の中の星座の向きは ア〜エ のどれ？","a":"ウ。Wの両はしの線をのばして交わる点の反対がわに北極星がある。北極星が右下にあるので、線が左上で交わる形。","aimg":"img/kashi_zu3.jpg","src":"第5回育成テスト 理科[1](8) 図4","id":"fig-3"},{"s":"理科","topic":"星座の向き","img":["img/kashi_zu4.jpg","img/kashi_sentaku.jpg"],"q":"何時間かたつと、この星座は北極星の右下（北極星をはさんで、ちょうど反対がわ）に来た。そのときの向きは ア〜エ のどれ？","a":"ア。星座は形を変えずに北極星のまわりを回る。紙をさかさまにしてウを見ると、アと同じ形になる。","src":"第5回育成テスト 理科[1](8) 図4","id":"fig-4"},{"s":"理科","topic":"北の空の星","img":["img/kashi_zu4.jpg"],"q":"北の空の星は、北極星を中心に、どちら回りに、1時間に何度動いて見える？","a":"左回り（時計の針と反対回り）に、1時間に15度。","src":"第5回育成テスト 理科[2](1)","id":"fig-5"},{"s":"理科","topic":"オリオン座の動き","img":["img/orion_c.jpg"],"q":"カメラを固定して、19時から21時までオリオン座をさつえいした。星Aは あ→い に動いた。星Bが う の位置にあるとき、星Cと星Gは え〜き のどこ？","a":"星C＝え、星G＝か。線の左下のはしが19時（はじめ）。星はみんな同じ向き・同じ速さで動く。","src":"第5回育成テスト 理科[4]","id":"fig-6"},{"s":"理科","topic":"オリオン座の動き","img":["img/orion_c.jpg"],"q":"このオリオン座は、ア 左ななめ上にのぼる　イ 右ななめ上にのぼる　ウ 左ななめ下にしずむ　エ 右ななめ下にしずむ　のどのとき？ また、図のXの方角は？","a":"イ、東。左下から右上へ動く＝右ななめ上にのぼっていく。星がのぼるところが見えるのは東の空。","src":"第5回育成テスト 理科[4]","id":"fig-7"}];
const examIds = new Set(examDeck.map(c => c.id));
const byId = new Map([...deck, ...examDeck].map(c => [c.id, c]));
const subjects = ['国語', '算数', '理科', '社会'];
const MODES = { mix: { name: 'ミックス' }, exam: { name: '模試対策' }, normal: { name: '通常' } };
const MODE_ORDER = ['mix', 'exam', 'normal'];
const topicsOf = s => {
  const t = [...new Set(deck.filter(c => c.s === s).map(c => c.topic))];
  // 「第○回」の単元（本科教室ステージⅢ）を後ろにまとめる
  return [...t.filter(x => !/^第\d/.test(x)), ...t.filter(x => /^第\d/.test(x))];
};
const KEY = 'four-subject-flashcards-v2';
const fresh = () => ({ hist: {}, done: {}, last: {}, best: {}, round: null, sel: { normal: null } });
let state = fresh();
let canSave = true;
try {
  const saved = localStorage.getItem(KEY);
  if (saved) state = Object.assign(fresh(), JSON.parse(saved));
  if (state.round && !MODES[state.round.mode]) state.round = null;
} catch { canSave = false; }
function save() {
  if (!canSave) return;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { canSave = false; document.getElementById('notice').hidden = false; }
}
if (!canSave) document.getElementById('notice').hidden = false;

function shuffle(a) { const c = [...a]; for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; }
function prio(card) { const e = state.hist[card.id]; if (!e) return 1; return e.needsReview ? 2 : 0; }
function order(cards) {
  // ×だったカード → まだ出ていないカード → ○だったカード。同じ順位の中では、出たのが前のものから
  return shuffle(cards).sort((a, b) => prio(b) - prio(a) || (state.hist[a.id]?.at ?? -1) - (state.hist[b.id]?.at ?? -1));
}
function selected(mode) {
  if (mode === 'normal') { const s = state.sel.normal; return s ? deck.filter(c => s.includes(c.s + '/' + c.topic)) : deck; }
  if (mode === 'mix') return [...examDeck, ...deck];
  return examDeck;
}
function pickIds(mode) {
  if (mode === 'exam') {
    const counts = [4, 2, 2, 2];
    const q = subjects.map((s, i) => order(examDeck.filter(c => c.s === s)).slice(0, counts[i]));
    return [0, 1, 2, 0, 3, 1, 0, 2, 3, 0].map(i => q[i].shift().id);
  }
  if (mode === 'mix') {
    // 国3・算3・理2・社2。教科の中では模試の型と通常を交互に出し、回ごとに先に出す方を入れかえる
    const flip = (state.done.mix ?? 0) % 2;
    const q = subjects.map(s => {
      const lists = [order(examDeck.filter(c => c.s === s)), order(deck.filter(c => c.s === s))];
      if (flip) lists.reverse();
      return { lists, k: 0 };
    });
    const take = i => { const x = q[i]; const l = x.lists[x.k % 2].length ? x.lists[x.k % 2] : x.lists[(x.k + 1) % 2]; x.k++; return l.shift(); };
    return [0, 1, 2, 3, 0, 1, 2, 0, 3, 1].map(i => take(i)).filter(Boolean).map(c => c.id);
  }
  const pool = selected(mode);
  // 通常：教科を順番に回して10問。同じ教科が続かないようにする
  const done = state.done.normal ?? 0;
  const qs = subjects.map(s => order(pool.filter(c => c.s === s))).filter(q => q.length);
  const start = qs.length ? done % qs.length : 0;
  const ids = [];
  for (let k = 0; ids.length < 10 && qs.some(q => q.length); k++) {
    const q = qs[(start + k) % qs.length];
    if (q.length) ids.push(q.shift().id);
  }
  return ids;
}
let tick = null;
function begin(mode) {
  const ids = pickIds(mode);
  if (!ids.length) return;
  state.round = { mode, ids, marks: [], secs: [], revealed: false, t0: Date.now() };
  save(); render(true);
}
function reveal() {
  const r = state.round; if (!r || r.revealed || r.marks.length === r.ids.length) return;
  r.secs[r.marks.length] = Math.round((Date.now() - r.t0) / 1000);
  r.revealed = true; save(); render(true);
}
function mark(ok) {
  const r = state.round; if (!r?.revealed || r.marks.length === r.ids.length) return;
  const id = r.ids[r.marks.length];
  const e = state.hist[id] ??= { right: 0, wrong: 0 };
  e[ok ? 'right' : 'wrong']++; e.needsReview = !ok; e.at = Date.now();
  r.marks.push(ok); r.revealed = false; r.t0 = Date.now();
  if (r.marks.length === r.ids.length) {
    const right = r.marks.filter(Boolean).length, n = r.ids.length;
    r.prev = state.last[r.mode] ?? null;
    r.prevBest = state.best[r.mode] ?? null;
    state.last[r.mode] = { right, n };
    const b = state.best[r.mode];
    if (!b || right / n > b.right / b.n) state.best[r.mode] = { right, n };
    state.done[r.mode] = (state.done[r.mode] ?? 0) + 1;
  }
  save(); render(true);
}
function home() { state.round = null; save(); render(true); }

const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const pill = s => '<span class="pill s' + subjects.indexOf(s) + '">' + s + '</span>';

function verdict(r) {
  const right = r.marks.filter(Boolean).length, n = r.ids.length;
  if (right === n) return ['全部〇！', '1枚も×がなかった。'];
  if (!r.prev) return ['1回目の記録', 'つぎの回で、この記録をこえよう。'];
  const now = right / n, before = r.prev.right / r.prev.n;
  if (now > before) return ['前回の自分に勝ち！', '前回より〇が増えた。'];
  if (now === before) return ['前回の自分と引き分け', '×のカードは、つぎの回で先に出る。'];
  return ['つぎで取り返そう', '×のカードは、つぎの回で先に出る。もう一度やれば覚えられる。'];
}

function renderHome(game) {
  const ns = selected('normal').length;
  const node = el('<section class="panel"></section>');
  node.innerHTML =
    '<h2 tabindex="-1" id="headline">今日はどれをやる？</h2>' +
    '<div class="modes">' +
    '<div class="mode new"><b>ミックス<span class="new-tag">おすすめ</span></b><p>模試の型と通常を交互に。国語3・算数3・理科2・社会2 の10問（全' + (examDeck.length + deck.length) + '枚から）。</p><button type="button" data-action="mix">はじめる</button></div>' +
    '<div class="mode"><b>模試対策</b><p>国語4・算数2・理科2・社会2 の10問（全' + examDeck.length + '枚から）。テストで落とした型と、テストに出た図。</p><button type="button" data-action="exam">はじめる</button></div>' +
    '<div class="mode"><b>通常</b><p>4教科 ' + ns + '枚から' + Math.min(10, ns) + '問。単元をえらべる。「第○回」は本科教室の単元で、図のカードもここに入っている。</p><button type="button" data-action="normal"' + (ns ? '' : ' disabled') + '>はじめる</button></div>' +
    '</div>' +
    '<details class="pick" id="pickNormal"><summary>通常：単元をえらぶ</summary>' +
    subjects.map((s, si) => '<div class="subj-row">' + pill(s) + '<div class="chips">' +
      topicsOf(s).map((t, ti) => { const v = s + '/' + t; return '<label class="chip"><input type="checkbox" id="tp' + si + '_' + ti + '" data-sel="normal" value="' + esc(v) + '"' + (!state.sel.normal || state.sel.normal.includes(v) ? ' checked' : '') + '>' + esc(t) + '</label>'; }).join('') +
      '</div></div>').join('') +
    '<div class="actions"><button type="button" class="link" data-action="allTopics">全部えらぶ</button></div></details>' +
    '<p class="help">勝ち負けは、前回の自分の〇の数とくらべる。×だったカードは、つぎの回で先に出る（ミックスで×になったカードは、模試対策・通常でも先に出る）。漢字と計算のカードには目安の時間がある。</p>';
  game.append(node);
  node.querySelectorAll('input[data-sel]').forEach(inp => inp.addEventListener('change', () => {
    const m = inp.dataset.sel;
    const vals = [...node.querySelectorAll('input[data-sel="' + m + '"]:checked')].map(x => x.value);
    state.sel[m] = vals; save(); render(false, m);
  }));
}

function renderCard(game, r) {
  const i = r.marks.length, card = byId.get(r.ids[i]), n = r.ids.length;
  const track = r.ids.map((_, k) => '<span class="' + (k === i ? 'current' : k > i ? '' : r.marks[k] ? 'correct' : 'wrong') + '"></span>').join('');
  const node = el('<div style="display:flex;flex-direction:column;gap:12px"></div>');
  node.innerHTML =
    '<div class="top"><strong>' + MODES[r.mode].name + ' · ' + ((state.done[r.mode] ?? 0) + 1) + '回目</strong><span class="meta">' + (i + 1) + ' / ' + n + ' 問</span></div>' +
    '<div class="track" aria-hidden="true">' + track + '</div>' +
    '<section class="panel">' +
    '<div class="status">' + pill(card.s) + (r.mode === 'mix' && examIds.has(card.id) ? '<span class="pill kind">模試の型</span>' : '') + '<span class="meta">' + esc(card.topic) + '</span></div>' +
    (card.img ? '<div class="figs">' + card.img.map(src => '<img src="' + src + '" alt="' + esc(card.topic) + 'の図">').join('') + '</div>' : '') +
    '<p class="face">表 · 問題</p><h2 class="q" id="headline" tabindex="-1"></h2>' +
    (!r.revealed && card.t ? '<div class="timer" id="timer"><span id="sec">0秒</span><div class="bar"><i id="barfill"></i></div><span>目安 ' + card.t + '秒</span></div>' : '') +
    (r.revealed
      ? '<div class="back" id="back" tabindex="-1"><p class="face">裏 · 答え</p><p class="ans" id="answer"></p>' +
        (card.aimg ? '<img src="' + card.aimg + '" alt="答えの図">' : '') +
        (card.src ? '<p class="src">出どころ：' + esc(card.src) + '</p>' : '') + '</div>' +
        (card.t && r.secs[i] != null ? '<p class="help">' + r.secs[i] + '秒かかった（目安 ' + card.t + '秒）' + (r.secs[i] > card.t ? '。もう少し速くできるように。' : '。目安の時間でできた。') + '</p>' : '') +
        (card.w ? '<p class="help">記述は、必要な内容が入っていれば〇。</p>' : '') +
        '<div class="actions"><button type="button" class="ok" data-action="right">〇 正解</button><button type="button" class="ng" data-action="wrong">× 不正解</button></div>'
      : '<div class="actions"><button type="button" data-action="reveal">答えを見る</button></div>') +
    '</section>' +
    '<div class="actions"><button type="button" class="link" data-action="home">やめて最初の画面へ</button></div>';
  game.append(node);
  node.querySelector('#headline').textContent = card.q;
  if (r.revealed) node.querySelector('#answer').textContent = card.a;
  if (!r.revealed && card.t) {
    const upd = () => {
      const s = Math.floor((Date.now() - r.t0) / 1000);
      const t = document.getElementById('timer'); if (!t) return;
      document.getElementById('sec').textContent = s + '秒';
      document.getElementById('barfill').style.width = Math.min(100, s / card.t * 100) + '%';
      t.classList.toggle('over', s > card.t);
    };
    upd(); tick = setInterval(upd, 250);
  }
}

function renderResult(game, r) {
  const right = r.marks.filter(Boolean).length, n = r.ids.length;
  const [head, sub] = verdict(r);
  const slow = r.ids.map((id, k) => ({ card: byId.get(id), s: r.secs[k] })).filter(x => x.card.t && x.s > x.card.t);
  const node = el('<section class="panel result"></section>');
  node.innerHTML =
    '<h2 tabindex="-1" id="headline">' + head + '</h2><p class="help" style="margin:0">' + sub + '</p>' +
    '<div class="score"><div><span>今回</span><b>' + right + ' / ' + n + '</b></div>' +
    (r.prev ? '<div><span>前回</span><b>' + r.prev.right + ' / ' + r.prev.n + '</b></div>' : '') +
    (state.best[r.mode] ? '<div><span>いちばんよかった回</span><b>' + state.best[r.mode].right + ' / ' + state.best[r.mode].n + '</b></div>' : '') + '</div>' +
    (right < n ? '<details open><summary>今回 × だったカード</summary><ul class="list" id="misses"></ul></details>' : '') +
    (slow.length ? '<details><summary>目安より時間がかかったカード（' + slow.length + '枚）</summary><ul class="list" id="slow"></ul></details>' : '') +
    '<div class="actions"><button type="button" data-action="' + r.mode + '">つぎの10問へ</button><button type="button" class="secondary" data-action="home">最初の画面へ</button></div>';
  game.append(node);
  const add = (ul, card, extra) => { const li = document.createElement('li'); li.textContent = card.s + ' · ' + card.q; const sp = document.createElement('span'); sp.textContent = card.a + (extra || ''); li.append(sp); ul.append(li); };
  if (right < n) { const ul = node.querySelector('#misses'); r.ids.forEach((id, k) => { if (!r.marks[k]) add(ul, byId.get(id)); }); }
  if (slow.length) { const ul = node.querySelector('#slow'); slow.forEach(x => add(ul, x.card, '（' + x.s + '秒・目安' + x.card.t + '秒）')); }
}

function renderStats() {
  const m = state.round?.mode ?? 'mix';
  const d = selected(m);
  const es = d.map(c => state.hist[c.id]).filter(Boolean);
  const right = es.reduce((a, e) => a + e.right, 0), tot = es.reduce((a, e) => a + e.right + e.wrong, 0);
  document.getElementById('stats').innerHTML =
    '<div>' + MODES[m].name + ' 学習したカード<strong>' + es.length + ' / ' + d.length + '</strong></div>' +
    '<div>正答率<strong>' + (tot ? Math.round(right / tot * 100) + '%' : '—') + '</strong></div>' +
    '<div>復習待ち<strong>' + es.filter(e => e.needsReview).length + ' 枚</strong></div>';
}

function renderParent() {
  const box = document.getElementById('parentBox');
  const rows = Object.entries(state.hist).filter(([id, e]) => e.wrong && byId.has(id))
    .map(([id, e]) => ({ c: byId.get(id), e })).sort((a, b) => b.e.wrong - a.e.wrong || (b.e.needsReview - a.e.needsReview)).slice(0, 15);
  const modeLine = MODE_ORDER.map(m => MODES[m].name + ' ' + (state.done[m] ?? 0) + '回' + (state.last[m] ? '（前回 ' + state.last[m].right + '/' + state.last[m].n + '）' : '')).join('　');
  const wasOpen = box.querySelector('details')?.open;
  box.innerHTML = '<details class="parent"' + (wasOpen ? ' open' : '') + '><summary>おうちの人へ（記録）</summary>' +
    '<p class="help">' + modeLine + '</p>' +
    (rows.length ? '<div class="tablewrap"><table><thead><tr><th>×が多いカード</th><th>×</th><th>〇</th><th>いま</th></tr></thead><tbody>' +
      rows.map(x => '<tr><td>' + esc(x.c.s + '・' + x.c.topic) + '<br><span class="meta">' + esc(x.c.q) + '</span></td><td class="n">' + x.e.wrong + '</td><td class="n">' + x.e.right + '</td><td class="n">' + (x.e.needsReview ? '×' : '〇') + '</td></tr>').join('') +
      '</tbody></table></div>' : '<p class="help">まだ × のカードはありません。</p>') +
    '<div class="actions"><button type="button" class="secondary" data-action="copy">記録を文字でコピー</button><button type="button" class="secondary" data-action="askReset">記録を消す</button></div>' +
    '<div id="parentExtra"></div>' +
    '<p class="note">記録はこの端末のこのブラウザだけに残ります。iPadとパソコンを行き来すると記録は別々になります。</p></details>';
}
function recordText() {
  const lines = ['４教科フラッシュカード 記録（' + new Date().toLocaleDateString('ja-JP') + '）'];
  MODE_ORDER.forEach(m => lines.push(MODES[m].name + '：' + (state.done[m] ?? 0) + '回' + (state.last[m] ? '／前回 ' + state.last[m].right + '/' + state.last[m].n : '') + (state.best[m] ? '／最高 ' + state.best[m].right + '/' + state.best[m].n : '')));
  lines.push('', '×が1回以上あるカード（×回数・〇回数・いま）');
  Object.entries(state.hist).filter(([id, e]) => e.wrong && byId.has(id)).sort((a, b) => b[1].wrong - a[1].wrong)
    .forEach(([id, e]) => { const c = byId.get(id); lines.push('・' + c.s + '／' + c.topic + '：' + c.q + ' → ×' + e.wrong + ' 〇' + e.right + ' ' + (e.needsReview ? '×' : '〇')); });
  return lines.join('\n');
}
function copyRecord() {
  const text = recordText();
  const box = document.getElementById('parentExtra');
  const show = (msg) => { box.innerHTML = '<p class="help">' + msg + '</p><textarea id="recordText" readonly></textarea>'; const ta = document.getElementById('recordText'); ta.value = text; ta.select(); };
  try {
    navigator.clipboard.writeText(text).then(() => { box.innerHTML = '<p class="help">コピーしました。メモやLINEにはりつけられます。</p>'; }, () => show('自動でコピーできなかったので、下の文字を選んでコピーしてください。'));
  } catch { show('自動でコピーできなかったので、下の文字を選んでコピーしてください。'); }
}
// お父さんにメールで送る（2026-11-26）
function sendDad(subject, body, how) {
  const to = ['haru5385', 'gmail.com'].join('@');
  if (body.length > 1800) body = body.slice(0, 1800) + '\n…（つづきは省略）';
  if (how === 'gmail') window.open('https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(to) + '&su=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body), '_blank', 'noopener');
  else location.href = 'mailto:' + to + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
}
function mailRecord(how) {
  sendDad('友博 ４教科フラッシュカードの記録（' + new Date().toLocaleDateString('ja-JP') + '）', recordText() + '\n\n（フラッシュカードから送信）', how);
  document.getElementById('mailMsg').textContent = 'メールの画面が開いたら、そのまま「送信」をおしてね。';
}
function askReset() {
  document.getElementById('parentExtra').innerHTML = '<p class="help">すべての記録を消します。元にもどせません。</p><div class="actions"><button type="button" class="ng" data-action="reset">消す</button><button type="button" class="secondary" data-action="cancelReset">やめる</button></div>';
}
function reset() { const sel = state.sel; state = fresh(); state.sel = sel; save(); render(true); }

function render(focus = false, keepOpen) {
  clearInterval(tick); tick = null;
  const openNormal = document.getElementById('pickNormal')?.open;
  const game = document.getElementById('game'); game.innerHTML = '';
  const r = state.round;
  if (!r) renderHome(game);
  else if (r.marks.length === r.ids.length) renderResult(game, r);
  else renderCard(game, r);
  if (!r) { if (openNormal) document.getElementById('pickNormal').open = true; }
  renderStats(); renderParent();
  if (focus) (document.getElementById('back') ?? document.getElementById('headline'))?.focus();
}

const actions = {
  mix: () => begin('mix'), exam: () => begin('exam'), normal: () => begin('normal'),
  reveal, right: () => mark(true), wrong: () => mark(false), home,
  allTopics: () => { state.sel.normal = null; save(); render(); },
  copy: copyRecord, mailGmail: () => mailRecord('gmail'), mailApp: () => mailRecord('app'), askReset, reset, cancelReset: () => { document.getElementById('parentExtra').innerHTML = ''; },
};
document.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-action]');
  if (b && actions[b.dataset.action]) actions[b.dataset.action]();
});
render();
</script>
